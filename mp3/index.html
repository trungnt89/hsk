<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Báo Thức YouTube - Hẹn Giờ Nhạc YouTube</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22%20width=%22100%22%20height=%22100%22><text y=%22.9em%22 font-size=%2290%22>⏰</text></svg>">
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --surface-hover: #334155;
            --primary: #ef4444;
            --primary-hover: #dc2626;
            --accent: #38bdf8;
            --text: #f8fafc;
            --text-sub: #94a3b8;
            --border: #334155;
            --card-radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 540px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        header {
            text-align: center;
            padding: 12px 0 4px;
        }

        .app-title {
            font-size: 1.5rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #fff;
        }

        .app-title span.yt-tag {
            background: #ef4444;
            color: #fff;
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Đồng hồ số hiện tại */
        .clock-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--card-radius);
            padding: 16px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.25);
        }

        .clock-time {
            font-size: 2.8rem;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            letter-spacing: 1px;
            color: #38bdf8;
        }

        .clock-date {
            font-size: 0.9rem;
            color: var(--text-sub);
            margin-top: 2px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--card-radius);
            padding: 18px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
        }

        .card-title {
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 12px;
        }

        .form-label {
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-sub);
        }

        .form-input {
            width: 100%;
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 14px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-input:focus {
            border-color: #38bdf8;
        }

        .form-time-input {
            font-size: 1.5rem;
            font-weight: 700;
            text-align: center;
            letter-spacing: 2px;
            padding: 8px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: var(--text);
            cursor: pointer;
            user-select: none;
        }

        .checkbox-label input {
            accent-color: #ef4444;
            width: 17px;
            height: 17px;
        }

        .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 14px;
        }

        .btn {
            flex: 1;
            padding: 12px 14px;
            border-radius: 10px;
            border: none;
            font-size: 0.92rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background: #ef4444;
            color: #fff;
        }
        .btn-primary:hover { background: #dc2626; }

        .btn-secondary {
            background: #334155;
            color: #f8fafc;
        }
        .btn-secondary:hover { background: #475569; }

        .btn-accent {
            background: #0284c7;
            color: #fff;
        }
        .btn-accent:hover { background: #0369a1; }

        /* Danh sách mốc báo thức */
        .alarm-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .alarm-item {
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .alarm-item.disabled {
            opacity: 0.5;
        }

        .alarm-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow: hidden;
        }

        .alarm-time {
            font-size: 1.45rem;
            font-weight: 800;
            color: #38bdf8;
            letter-spacing: 1px;
        }

        .alarm-title {
            font-size: 0.82rem;
            color: var(--text-sub);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .alarm-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toggle-switch {
            position: relative;
            width: 44px;
            height: 24px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background-color: #475569;
            transition: .2s;
            border-radius: 24px;
        }

        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .2s;
            border-radius: 50%;
        }

        input:checked + .toggle-slider {
            background-color: #22c55e;
        }

        input:checked + .toggle-slider:before {
            transform: translateX(20px);
        }

        .btn-icon {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-sub);
            border-radius: 8px;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .btn-icon:hover {
            color: #ef4444;
            border-color: #ef4444;
        }

        /* Khung phát YouTube duy trì trong DOM */
        .yt-box {
            margin-top: 10px;
            border-radius: 10px;
            overflow: hidden;
            background: #000;
            aspect-ratio: 16 / 9;
            width: 100%;
            position: relative;
        }

        .yt-preplay-banner {
            background: #1e3a8a;
            border: 1px solid #3b82f6;
            border-radius: 8px;
            padding: 8px 12px;
            margin-top: 8px;
            font-size: 0.8rem;
            color: #bfdbfe;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Overlay khi chuông reo */
        .alarm-ringing-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.97);
            z-index: 999999;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            text-align: center;
        }

        .ring-time {
            font-size: 3.6rem;
            font-weight: 900;
            color: #ef4444;
            animation: pulse 1s infinite;
        }

        .ring-title {
            font-size: 1.1rem;
            color: #f8fafc;
            margin: 10px 0 20px;
            max-width: 90%;
            word-break: break-word;
        }

        .ring-yt-wrapper {
            width: 100%;
            max-width: 480px;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 24px;
            box-shadow: 0 8px 32px rgba(239, 68, 68, 0.3);
        }

        .btn-stop-alarm {
            background: #ef4444;
            color: #fff;
            font-size: 1.25rem;
            font-weight: 800;
            padding: 16px 36px;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 24px rgba(239, 68, 68, 0.6);
            transition: transform 0.15s;
        }

        .btn-stop-alarm:active {
            transform: scale(0.95);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.05); opacity: 0.85; }
        }

        .empty-hint {
            text-align: center;
            color: var(--text-sub);
            padding: 20px 0;
            font-size: 0.88rem;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="app-title">
            <span>⏰ Báo Thức YouTube</span>
            <span class="yt-tag">Auto Play</span>
        </div>
    </header>

    <!-- ĐỒNG HỒ HIỆN TẠI -->
    <div class="clock-card">
        <div class="clock-time" id="clockTime">00:00:00</div>
        <div class="clock-date" id="clockDate">Đang cập nhật...</div>
    </div>

    <!-- FORM THIẾT LẬP BÁO THỨC -->
    <div class="card">
        <div class="card-title">
            <span>➕ Hẹn giờ báo thức mới</span>
        </div>

        <div class="form-group">
            <label class="form-label" for="alarmTime">Giờ báo thức (24h)</label>
            <input type="time" id="alarmTime" class="form-input form-time-input" required>
        </div>

        <div class="form-group">
            <label class="form-label" for="ytUrl">Link hoặc ID YouTube</label>
            <input type="text" id="ytUrl" class="form-input" placeholder="Dán link YouTube (vd: https://youtu.be/...)" oninput="onYtUrlChange()">
        </div>

        <div class="form-group">
            <label class="form-label" for="alarmLabel">Tên mốc hẹn (tùy chọn)</label>
            <input type="text" id="alarmLabel" class="form-input" placeholder="Ví dụ: Báo thức buổi sáng, Tập thể dục...">
        </div>

        <div style="display: flex; flex-direction: column; gap: 8px; margin: 10px 0;">
            <label class="checkbox-label">
                <input type="checkbox" id="preplay30s" checked>
                <span>⚡ Phát thử 30s rồi Pause khi lưu (đến giờ tự động Play)</span>
            </label>
            <label class="checkbox-label">
                <input type="checkbox" id="continuousLoop" checked>
                <span>🔁 Lặp lại liên tục cho đến khi bấm tắt</span>
            </label>
        </div>

        <!-- KHUNG PHÁT YOUTUBE MASTER DUY TRÌ LIÊN TỤC -->
        <div id="ytContainer" class="yt-box" style="display: none;">
            <iframe id="ytIframe" width="100%" height="100%" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen style="border:none;"></iframe>
        </div>

        <div id="preplayStatus" class="yt-preplay-banner" style="display: none;">
            <span id="preplayText">Đang phát thử...</span>
            <button type="button" class="btn btn-secondary" style="padding: 4px 10px; font-size: 0.75rem; flex: none;" onclick="pausePreplay()">⏸️ Pause ngay</button>
        </div>

        <div class="btn-row">
            <button type="button" class="btn btn-accent" id="btnTest" onclick="startPreplay(30)">
                <span>▶️ Thử 30s</span>
            </button>
            <button type="button" class="btn btn-primary" onclick="saveAlarm()">
                <span>💾 Lưu Báo Thức</span>
            </button>
        </div>
    </div>

    <!-- DANH SÁCH BÁO THỨC ĐÃ LƯU -->
    <div class="card">
        <div class="card-title">
            <span>📋 Danh sách báo thức</span>
        </div>
        <div class="alarm-list" id="alarmList">
            <div class="empty-hint">Chưa có mốc báo thức nào. Hãy thêm mốc ở trên!</div>
        </div>
    </div>
</div>

<!-- MÀN HÌNH BÁO THỨC CHUÔNG REO TOÀN MÀN HÌNH -->
<div class="alarm-ringing-overlay" id="ringOverlay">
    <div class="ring-time" id="ringTime">00:00</div>
    <div class="ring-title" id="ringTitle">Báo thức YouTube đang phát!</div>
    
    <div class="ring-yt-wrapper" id="ringYtWrapper">
        <!-- Iframe YouTube sẽ được chuyển vào đây khi reo -->
    </div>

    <button type="button" class="btn-stop-alarm" onclick="stopAlarm()">
        🔕 TẮT BÁO THỨC
    </button>
</div>

<script>
    // --- QUẢN LÝ DỮ LIỆU BÁO THỨC (LOCALSTORAGE) ---
    const STORAGE_KEY = 'yt_alarms_simple_v1';
    let alarms = [];
    let activeRingingAlarm = null;
    let preplayTimer = null;
    let preplayInterval = null;
    let audioCtx = null;

    // Load dữ liệu khi mở trang
    try {
        const data = localStorage.getItem(STORAGE_KEY);
        if (data) alarms = JSON.parse(data);
    } catch (e) {
        alarms = [];
    }

    // Trích xuất ID YouTube chuẩn xác
    function extractYouTubeId(url) {
        if (!url) return '';
        url = url.trim();
        if (/^[a-zA-Z0-9_-]{11}$/.test(url)) return url;
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/;
        const match = url.match(regExp);
        return (match && match[2].length === 11) ? match[2] : '';
    }

    // Đảm bảo Web Audio không ngủ gật trên Safari/iOS
    function unlockAudio() {
        if (!audioCtx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (AudioContext) audioCtx = new AudioContext();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        if (navigator.wakeLock && navigator.wakeLock.request) {
            navigator.wakeLock.request('screen').catch(() => {});
        }
    }

    // Cập nhật đồng hồ thời gian thực
    function updateClock() {
        const now = new Date();
        const h = String(now.getHours()).padStart(2, '0');
        const m = String(now.getMinutes()).padStart(2, '0');
        const s = String(now.getSeconds()).padStart(2, '0');
        const timeStr = `${h}:${m}:${s}`;
        document.getElementById('clockTime').innerText = timeStr;

        const options = { weekday: 'long', year: 'numeric', month: 'numeric', day: 'numeric' };
        document.getElementById('clockDate').innerText = now.toLocaleDateString('vi-VN', options);

        // Kiểm tra báo thức tại giây 00
        if (s === '00' && !activeRingingAlarm) {
            checkAlarms(`${h}:${m}`);
        }
    }

    setInterval(updateClock, 1000);
    updateClock();

    // Điền giờ mặc định vào ô nhập (hiện tại + 5 phút)
    function setDefaultTime() {
        const d = new Date();
        d.setMinutes(d.getMinutes() + 5);
        const hh = String(d.getHours()).padStart(2, '0');
        const mm = String(d.getMinutes()).padStart(2, '0');
        const el = document.getElementById('alarmTime');
        if (el && !el.value) el.value = `${hh}:${mm}`;
    }
    setDefaultTime();

    // Điều khiển iframe YouTube
    function sendYtCommand(func, args = []) {
        const iframe = document.getElementById('ytIframe');
        if (iframe && iframe.contentWindow) {
            iframe.contentWindow.postMessage(JSON.stringify({
                event: 'command',
                func: func,
                args: args
            }), '*');
        }
    }

    function onYtUrlChange() {
        const url = document.getElementById('ytUrl').value;
        const vid = extractYouTubeId(url);
        const box = document.getElementById('ytContainer');
        const iframe = document.getElementById('ytIframe');

        if (vid) {
            box.style.display = 'block';
            const origin = encodeURIComponent(window.location.origin);
            const src = `https://www.youtube-nocookie.com/embed/${vid}?enablejsapi=1&playsinline=1&autoplay=0&origin=${origin}`;
            if (!iframe.src || !iframe.src.includes(vid)) {
                iframe.src = src;
            }
        }
    }

    // Phát thử 30s rồi Pause
    function startPreplay(seconds = 30) {
        unlockAudio();
        const url = document.getElementById('ytUrl').value;
        const vid = extractYouTubeId(url);
        if (!vid) {
            alert('Vui lòng dán link YouTube hợp lệ!');
            return;
        }

        const box = document.getElementById('ytContainer');
        const iframe = document.getElementById('ytIframe');
        const banner = document.getElementById('preplayStatus');
        const preplayText = document.getElementById('preplayText');

        box.style.display = 'block';
        banner.style.display = 'flex';

        const origin = encodeURIComponent(window.location.origin);
        const loop = document.getElementById('continuousLoop').checked ? 1 : 0;
        iframe.src = `https://www.youtube-nocookie.com/embed/${vid}?enablejsapi=1&playsinline=1&autoplay=1&mute=0&controls=1&loop=${loop}&playlist=${vid}&origin=${origin}`;

        let remain = seconds;
        preplayText.innerText = `🔊 Đang phát thử: còn ${remain}s (sẽ tự Pause)...`;

        clearInterval(preplayInterval);
        clearTimeout(preplayTimer);

        preplayInterval = setInterval(() => {
            remain--;
            if (remain > 0) {
                preplayText.innerText = `🔊 Đang phát thử: còn ${remain}s (sẽ tự Pause)...`;
            } else {
                pausePreplay();
            }
        }, 1000);

        preplayTimer = setTimeout(pausePreplay, seconds * 1000);
    }

    // Tạm dừng phát thử
    function pausePreplay() {
        clearInterval(preplayInterval);
        clearTimeout(preplayTimer);
        sendYtCommand('pauseVideo');
        const banner = document.getElementById('preplayStatus');
        const preplayText = document.getElementById('preplayText');
        if (preplayText) preplayText.innerText = '⏸️ Đã Pause! Đến giờ hẹn sẽ tự động phát tiếp.';
        setTimeout(() => {
            if (banner) banner.style.display = 'none';
        }, 1500);
    }

    // Lưu mốc báo thức
    function saveAlarm() {
        unlockAudio();
        const timeVal = document.getElementById('alarmTime').value;
        const urlVal = document.getElementById('ytUrl').value;
        const labelVal = document.getElementById('alarmLabel').value.trim();
        const preplay = document.getElementById('preplay30s').checked;
        const loop = document.getElementById('continuousLoop').checked;

        if (!timeVal) {
            alert('Vui lòng chọn giờ báo thức!');
            return;
        }
        const vid = extractYouTubeId(urlVal);
        if (!vid) {
            alert('Vui lòng dán link YouTube hợp lệ!');
            return;
        }

        const newAlarm = {
            id: Date.now().toString(),
            time: timeVal,
            url: urlVal,
            vid: vid,
            label: labelVal || `YouTube (${vid})`,
            loop: loop,
            enabled: true
        };

        alarms.push(newAlarm);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(alarms));
        renderAlarms();

        if (preplay) {
            startPreplay(30);
        } else {
            alert(`Đã lưu báo thức ${timeVal}!`);
        }
    }

    // Bật/Tắt mốc báo thức
    function toggleAlarm(id) {
        unlockAudio();
        const item = alarms.find(a => a.id === id);
        if (item) {
            item.enabled = !item.enabled;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(alarms));
            renderAlarms();
            // Nếu bật, nạp sẵn video vào player
            if (item.enabled) {
                document.getElementById('ytUrl').value = item.url;
                onYtUrlChange();
            }
        }
    }

    // Xóa mốc báo thức
    function deleteAlarm(id) {
        if (!confirm('Bạn có chắc muốn xóa mốc báo thức này?')) return;
        alarms = alarms.filter(a => a.id !== id);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(alarms));
        renderAlarms();
    }

    // Thử báo thức ngay lập tức
    function triggerAlarmNow(id) {
        unlockAudio();
        const item = alarms.find(a => a.id === id);
        if (item) triggerAlarm(item);
    }

    // Hiển thị danh sách
    function renderAlarms() {
        const listEl = document.getElementById('alarmList');
        if (!alarms || alarms.length === 0) {
            listEl.innerHTML = '<div class="empty-hint">Chưa có mốc báo thức nào. Hãy thêm mốc ở trên!</div>';
            return;
        }

        // Sắp xếp theo giờ tăng dần
        alarms.sort((a, b) => a.time.localeCompare(b.time));

        listEl.innerHTML = alarms.map(a => `
            <div class="alarm-item ${a.enabled ? '' : 'disabled'}">
                <div class="alarm-info">
                    <div class="alarm-time">${a.time}</div>
                    <div class="alarm-title">🎵 ${escapeHtml(a.label)}</div>
                </div>
                <div class="alarm-actions">
                    <button type="button" class="btn-icon" title="Thử phát ngay" onclick="triggerAlarmNow('${a.id}')">▶️</button>
                    <button type="button" class="btn-icon" title="Xóa" onclick="deleteAlarm('${a.id}')">🗑️</button>
                    <label class="toggle-switch">
                        <input type="checkbox" ${a.enabled ? 'checked' : ''} onchange="toggleAlarm('${a.id}')">
                        <span class="toggle-slider"></span>
                    </label>
                </div>
            </div>
        `).join('');
    }

    function escapeHtml(str) {
        return (str || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]);
    }

    // Kiểm tra giờ hẹn
    function checkAlarms(currentHHMM) {
        const match = alarms.find(a => a.enabled && a.time === currentHHMM);
        if (match) {
            triggerAlarm(match);
        }
    }

    // Kích hoạt chuông reo báo thức
    function triggerAlarm(alarm) {
        unlockAudio();
        activeRingingAlarm = alarm;

        const overlay = document.getElementById('ringOverlay');
        const ringTime = document.getElementById('ringTime');
        const ringTitle = document.getElementById('ringTitle');
        const ringYtWrapper = document.getElementById('ringYtWrapper');
        const iframe = document.getElementById('ytIframe');
        const ytBox = document.getElementById('ytContainer');

        ringTime.innerText = alarm.time;
        ringTitle.innerText = `🎵 ${alarm.label || 'Báo thức YouTube'}`;

        // Chuyển iframe vào modal chuông reo
        ytBox.style.display = 'none';
        ringYtWrapper.innerHTML = '';
        ringYtWrapper.appendChild(iframe);

        overlay.style.display = 'flex';

        // Lệnh phát video YouTube âm lượng tối đa
        const origin = encodeURIComponent(window.location.origin);
        const loop = alarm.loop ? 1 : 0;
        const targetSrc = `https://www.youtube-nocookie.com/embed/${alarm.vid}?enablejsapi=1&playsinline=1&autoplay=1&mute=0&controls=1&loop=${loop}&playlist=${alarm.vid}&origin=${origin}`;

        if (!iframe.src || !iframe.src.includes(alarm.vid)) {
            iframe.src = targetSrc;
        }

        const burstPlay = () => {
            sendYtCommand('unMute');
            sendYtCommand('setVolume', 100);
            sendYtCommand('playVideo');
        };
        burstPlay();
        setTimeout(burstPlay, 300);
        setTimeout(burstPlay, 800);
    }

    // Tắt chuông báo thức
    function stopAlarm() {
        activeRingingAlarm = null;
        sendYtCommand('pauseVideo');

        const overlay = document.getElementById('ringOverlay');
        const ringYtWrapper = document.getElementById('ringYtWrapper');
        const ytBox = document.getElementById('ytContainer');
        const iframe = document.getElementById('ytIframe');

        overlay.style.display = 'none';

        // Trả iframe về lại container ban đầu
        ringYtWrapper.innerHTML = '';
        ytBox.appendChild(iframe);
        ytBox.style.display = 'none';
    }

    // Mở khóa âm thanh lần đầu khi người dùng chạm bất kỳ đâu
    ['click', 'touchstart'].forEach(evt => {
        document.addEventListener(evt, unlockAudio, { once: true, passive: true });
    });

    renderAlarms();
</script>
</body>
</html>
