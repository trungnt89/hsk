<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Danh Mục Link Dự Án</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="./com/util.js"></script>
    <script src="./com/assistive.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: #F8FAFC;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .ios-press:active {
            transform: scale(0.985);
            opacity: 0.85;
        }
        /* Smooth transitions */
        .accordion-content {
            transition: max-height 0.25s ease-out, opacity 0.2s ease-out;
        }
        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.3);
            border-radius: 99px;
        }
    </style>
</head>
<body class="min-h-screen text-slate-800 pb-10 flex flex-col items-center">

    <!-- Top Sticky Header -->
    <header class="w-full bg-white/90 backdrop-blur-md border-b border-slate-200/80 sticky top-0 z-50 px-4 py-3 shadow-[0_1px_3px_rgba(0,0,0,0.03)]">
        <div class="max-w-2xl mx-auto flex items-center justify-between gap-3">
            <div class="flex items-center gap-2.5 min-w-0">
                <div class="w-9 h-9 rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-md shadow-indigo-200 shrink-0">
                    <i data-lucide="layout-grid" class="w-5 h-5"></i>
                </div>
                <div class="truncate">
                    <h1 class="text-base font-bold text-slate-900 leading-tight">Danh Mục Ứng Dụng</h1>
                    <p class="text-[11px] text-slate-500 font-medium leading-none mt-0.5" id="stats-badge">Đang tải dữ liệu...</p>
                </div>
            </div>
            
            <div class="flex items-center gap-1.5 shrink-0">
                <button onclick="toggleAllFolders()" id="btn-toggle-all" class="text-xs font-semibold px-2.5 py-1.5 rounded-lg bg-slate-100 text-slate-700 hover:bg-slate-200 active:scale-95 transition flex items-center gap-1">
                    <i data-lucide="chevrons-up-down" class="w-3.5 h-3.5"></i>
                    <span id="text-toggle-all">Mở tất cả</span>
                </button>
                <button onclick="fetchAndRenderLinks()" class="w-8 h-8 rounded-lg bg-slate-100 text-slate-700 hover:bg-slate-200 active:scale-95 transition flex items-center justify-center" title="Tải lại danh sách">
                    <i data-lucide="rotate-cw" class="w-4 h-4"></i>
                </button>
            </div>
        </div>

        <!-- Search Bar -->
        <div class="max-w-2xl mx-auto mt-2.5">
            <div class="relative flex items-center">
                <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 pointer-events-none"></i>
                <input 
                    type="text" 
                    id="search-input" 
                    placeholder="Tìm trang, công cụ hoặc thư mục..." 
                    oninput="handleSearch(this.value)"
                    class="w-full pl-9 pr-8 py-2 text-sm bg-slate-100/90 border border-slate-200/60 rounded-xl focus:outline-none focus:bg-white focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all placeholder:text-slate-400"
                >
                <button id="btn-clear-search" onclick="clearSearch()" class="hidden absolute right-2.5 text-slate-400 hover:text-slate-600 p-1">
                    <i data-lucide="x" class="w-3.5 h-3.5"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="w-full max-w-2xl px-3 sm:px-4 pt-3 flex-1 flex flex-col">
        
        <!-- Folder Accordion List -->
        <div class="flex flex-col gap-2.5" id="groups-container">
            <!-- Loading skeleton -->
            <div class="flex flex-col items-center justify-center py-16 text-slate-400">
                <div class="w-7 h-7 border-2 border-indigo-600 border-t-transparent rounded-full animate-spin mb-3"></div>
                <span class="text-xs font-mono font-medium tracking-wide uppercase text-slate-500">Đang đồng bộ danh mục...</span>
            </div>
        </div>

        <!-- Empty search result message -->
        <div id="no-results" class="hidden flex flex-col items-center justify-center py-12 text-center bg-white rounded-2xl border border-slate-200/80 p-6 my-2 shadow-sm">
            <div class="w-12 h-12 rounded-full bg-slate-100 flex items-center justify-center text-slate-400 mb-3">
                <i data-lucide="search-x" class="w-6 h-6"></i>
            </div>
            <h3 class="text-sm font-bold text-slate-800">Không tìm thấy kết quả</h3>
            <p class="text-xs text-slate-500 mt-1 max-w-xs">Không có trang hoặc tệp nào khớp với từ khóa tìm kiếm của bạn.</p>
            <button onclick="clearSearch()" class="mt-3 px-3 py-1.5 bg-indigo-50 text-indigo-600 text-xs font-semibold rounded-lg hover:bg-indigo-100 transition">
                Xóa tìm kiếm
            </button>
        </div>

    </main>

    <!-- Footer -->
    <footer class="w-full max-w-2xl text-center py-4 text-[11px] text-slate-400 font-mono">
        Directory Portal &bull; Mobile Optimized
    </footer>

    <script>
        let allGroups = {};
        let areAllExpanded = false;

        // Định dạng thông tin mô tả chi tiết & icon cho từng thư mục
        function getFolderMeta(folder) {
            const normalized = folder.toLowerCase();
            const metaMap = {
                'nikki': { name: 'Nhật Ký & AI', icon: 'book-open-check', color: 'emerald', desc: 'Ghi nhật ký, phát âm và xử lý AI' },
                'hsk': { name: 'Tiếng Trung (HSK)', icon: 'languages', color: 'rose', desc: 'Luyện thi, từ vựng và tra cứu Pinyin' },
                'mp3': { name: 'Trình Phát Âm Thanh', icon: 'music', color: 'indigo', desc: 'Nghe nhạc, báo thức và Google Drive' },
                'tik': { name: 'Đồng Hồ & Bấm Giờ', icon: 'clock', color: 'amber', desc: 'Bấm giờ, đồng hồ trực quan và đếm ngược' },
                'pmp': { name: 'Quản Lý Dự Án', icon: 'check-circle-2', color: 'blue', desc: 'Theo dõi tiến độ, nhiệm vụ và KPI' },
                'task': { name: 'Công Việc & Ghi Chú', icon: 'list-todo', color: 'violet', desc: 'Danh sách việc cần làm và phân loại' },
                'pomodoro': { name: 'Pomodoro', icon: 'timer', color: 'red', desc: 'Kỹ thuật tập trung làm việc 25 phút' },
                'notify': { name: 'Thông Báo', icon: 'bell', color: 'teal', desc: 'Hệ thống thông báo và nhắc nhở' },
                'sms': { name: 'SMS & Telegram', icon: 'send', color: 'sky', desc: 'Gửi tin nhắn và bot tương tác' },
                'tool': { name: 'Công Cụ Tiện Ích', icon: 'wrench', color: 'orange', desc: 'Chuyển đổi dữ liệu, tiện ích mở rộng' },
                'db': { name: 'Cơ Sở Dữ Liệu', icon: 'database', color: 'cyan', desc: 'Quản lý kho dữ liệu và cấu hình' },
                'jp': { name: 'Tiếng Nhật', icon: 'sparkles', color: 'pink', desc: 'Học từ vựng và mẫu câu tiếng Nhật' },
                'n1': { name: 'Luyện Thi JLPT', icon: 'award', color: 'fuchsia', desc: 'Ôn tập và đề thi cấp độ cao cấp' },
                'log': { name: 'Nhật Ký Hệ Thống', icon: 'file-text', color: 'slate', desc: 'Lịch sử hoạt động và giám sát' },
                'link': { name: 'Điều Hướng & Sheets', icon: 'external-link', color: 'slate', desc: 'Bảng tính Google và liên kết nội bộ' },
                'root': { name: 'Trang Chủ & Gốc', icon: 'home', color: 'slate', desc: 'Trang khởi đầu hệ thống' }
            };

            if (metaMap[normalized]) {
                return metaMap[normalized];
            }

            // Fallback màu sắc dựa theo hash chuỗi
            const colors = ['blue', 'emerald', 'indigo', 'purple', 'rose', 'amber', 'teal', 'sky', 'orange'];
            const icons = ['folder', 'layers', 'box', 'compass', 'cpu', 'terminal'];
            const hash = Array.from(normalized).reduce((acc, char) => acc + char.charCodeAt(0), 0);
            return {
                name: folder.toUpperCase(),
                icon: icons[hash % icons.length],
                color: colors[hash % colors.length],
                desc: 'Tài liệu và tệp ứng dụng'
            };
        }

        // Định dạng tên tệp tin hiển thị thân thiện, dễ đọc
        function formatDisplayName(path, folder) {
            let fileName = path.split('/').pop().replace('.html', '');
            let folderUpper = folder.toUpperCase();
            
            const customNames = {
                'nikki/index': 'Bảng Nhật Ký Chính & AI',
                'nikki/recorder': 'Bộ Ghi Âm & Luyện Giọng',
                'nikki/promt': 'Quản Lý Mẫu Prompt',
                'nikki/analyze': 'Phân Tích Dữ Liệu Nhật Ký',
                'nikki/image': 'Trình Xem & Quản Lý Ảnh',
                'hsk/index': 'Trang Học HSK (Bản Chuẩn)',
                'hsk/index1': 'Trang Học HSK (Bản Mở Rộng)',
                'hsk/pinin': 'Bảng Chữ Cái & Pinyin',
                'mp3/index': 'Trình Phát Nhạc MP3',
                'mp3/indexAuth': 'Trình Phát Nhạc (Google Drive Auth)',
                'mp3/photo': 'Bộ Sưu Tập Hình Ảnh MP3',
                'pmp/index': 'Dashboard Dự Án PMP',
                'pmp/index_v1': 'PMP Version 1.0',
                'tik/index': 'Đồng Hồ Bấm Giờ Chính',
                'tik/index1': 'Đồng Hồ Mẫu 1',
                'tik/index2': 'Đồng Hồ Mẫu 2',
                'tool/convert': 'Công Cụ Chuyển Đổi Dữ Liệu',
                'pomodoro/index': 'Đồng Hồ Tập Trung Pomodoro',
                'notify/index': 'Trung Tâm Thông Báo',
                'sms/index': 'Tin Nhắn & Telegram Bot',
                'task/index': 'Quản Lý Công Việc (Tasks)',
                'jp/index': 'Học Tiếng Nhật (Main)',
                'n1/index': 'Luyện Thi JLPT N1',
                'db/index': 'Trình Xem Cơ Sở Dữ Liệu',
                'log/index': 'Nhật Ký Hoạt Động (Logs)',
                'link/index': 'Bảng Điều Hướng Internal'
            };

            const key = `${folder.toLowerCase()}/${fileName.toLowerCase()}`;
            if (customNames[key]) {
                return customNames[key];
            }

            if (fileName.toLowerCase() === "index") {
                return `${folderUpper} - Trang Chính`;
            }
            
            return fileName.replace(/[-_]/g, ' ')
                .split(' ')
                .map(w => w.charAt(0).toUpperCase() + w.slice(1))
                .join(' ');
        }

        // Tạo class màu sắc Tailwind phù hợp cho từng thư mục
        function getColorClasses(colorName) {
            const colorSchemes = {
                emerald: { bg: 'bg-emerald-50', text: 'text-emerald-600', border: 'border-emerald-200', pill: 'bg-emerald-100 text-emerald-700', active: 'hover:bg-emerald-50/50' },
                rose: { bg: 'bg-rose-50', text: 'text-rose-600', border: 'border-rose-200', pill: 'bg-rose-100 text-rose-700', active: 'hover:bg-rose-50/50' },
                indigo: { bg: 'bg-indigo-50', text: 'text-indigo-600', border: 'border-indigo-200', pill: 'bg-indigo-100 text-indigo-700', active: 'hover:bg-indigo-50/50' },
                amber: { bg: 'bg-amber-50', text: 'text-amber-600', border: 'border-amber-200', pill: 'bg-amber-100 text-amber-700', active: 'hover:bg-amber-50/50' },
                blue: { bg: 'bg-blue-50', text: 'text-blue-600', border: 'border-blue-200', pill: 'bg-blue-100 text-blue-700', active: 'hover:bg-blue-50/50' },
                violet: { bg: 'bg-violet-50', text: 'text-violet-600', border: 'border-violet-200', pill: 'bg-violet-100 text-violet-700', active: 'hover:bg-violet-50/50' },
                red: { bg: 'bg-red-50', text: 'text-red-600', border: 'border-red-200', pill: 'bg-red-100 text-red-700', active: 'hover:bg-red-50/50' },
                teal: { bg: 'bg-teal-50', text: 'text-teal-600', border: 'border-teal-200', pill: 'bg-teal-100 text-teal-700', active: 'hover:bg-teal-50/50' },
                sky: { bg: 'bg-sky-50', text: 'text-sky-600', border: 'border-sky-200', pill: 'bg-sky-100 text-sky-700', active: 'hover:bg-sky-50/50' },
                orange: { bg: 'bg-orange-50', text: 'text-orange-600', border: 'border-orange-200', pill: 'bg-orange-100 text-orange-700', active: 'hover:bg-orange-50/50' },
                cyan: { bg: 'bg-cyan-50', text: 'text-cyan-600', border: 'border-cyan-200', pill: 'bg-cyan-100 text-cyan-700', active: 'hover:bg-cyan-50/50' },
                pink: { bg: 'bg-pink-50', text: 'text-pink-600', border: 'border-pink-200', pill: 'bg-pink-100 text-pink-700', active: 'hover:bg-pink-50/50' },
                fuchsia: { bg: 'bg-fuchsia-50', text: 'text-fuchsia-600', border: 'border-fuchsia-200', pill: 'bg-fuchsia-100 text-fuchsia-700', active: 'hover:bg-fuchsia-50/50' },
                slate: { bg: 'bg-slate-100', text: 'text-slate-600', border: 'border-slate-200', pill: 'bg-slate-200 text-slate-700', active: 'hover:bg-slate-50' }
            };
            return colorSchemes[colorName] || colorSchemes['slate'];
        }

        // Đóng/Mở Accordion Thư mục
        function toggleFolder(folderId) {
            const content = document.getElementById(`content-${folderId}`);
            const chevron = document.getElementById(`chevron-${folderId}`);
            if (!content) return;

            const isHidden = content.classList.contains('hidden');

            if (isHidden) {
                content.classList.remove('hidden');
                if (chevron) chevron.classList.add('rotate-180');
            } else {
                content.classList.add('hidden');
                if (chevron) chevron.classList.remove('rotate-180');
            }
        }

        // Mở/Đóng toàn bộ thư mục
        function toggleAllFolders() {
            areAllExpanded = !areAllExpanded;
            const contents = document.querySelectorAll('[id^="content-folder-"]');
            const chevrons = document.querySelectorAll('[id^="chevron-folder-"]');
            const toggleText = document.getElementById('text-toggle-all');

            contents.forEach(c => {
                if (areAllExpanded) c.classList.remove('hidden');
                else c.classList.add('hidden');
            });

            chevrons.forEach(ch => {
                if (areAllExpanded) ch.classList.add('rotate-180');
                else ch.classList.remove('rotate-180');
            });

            if (toggleText) {
                toggleText.textContent = areAllExpanded ? 'Thu gọn' : 'Mở tất cả';
            }
        }

        // Tải và hiển thị danh sách từ list.txt
        async function fetchAndRenderLinks() {
            const container = document.getElementById('groups-container');
            container.innerHTML = `
                <div class="flex flex-col items-center justify-center py-16 text-slate-400">
                    <div class="w-7 h-7 border-2 border-indigo-600 border-t-transparent rounded-full animate-spin mb-3"></div>
                    <span class="text-xs font-mono font-medium tracking-wide uppercase text-slate-500">Đang tải danh sách...</span>
                </div>
            `;

            try {
                const response = await fetch('list.txt?t=' + Date.now());
                if (!response.ok) throw new Error('Không thể tải list.txt');
                const text = await response.text();
                const lines = text.split('\n');
                
                allGroups = {};
                let totalLinks = 0;

                lines.forEach(line => {
                    const cleanPath = line.trim();
                    if (!cleanPath) return;
                    if (cleanPath === "./index.html" || cleanPath === "index.html" || cleanPath === "./link.html" || cleanPath === "link.html") return;

                    const parts = cleanPath.split('/');
                    const folder = parts.length > 2 ? parts[1] : 'Root';

                    let displayName = formatDisplayName(cleanPath, folder);

                    if (!allGroups[folder]) allGroups[folder] = [];
                    allGroups[folder].push({
                        path: cleanPath,
                        displayName: displayName,
                        folder: folder
                    });
                    totalLinks++;
                });

                // Cập nhật thống kê
                const folderCount = Object.keys(allGroups).length;
                document.getElementById('stats-badge').textContent = `${folderCount} danh mục &bull; ${totalLinks} liên kết khả dụng`;

                renderGroups(allGroups);

            } catch (error) {
                console.error(error);
                container.innerHTML = `
                    <div class="p-6 text-center bg-white border border-red-200 rounded-2xl shadow-sm">
                        <div class="w-10 h-10 rounded-full bg-red-50 text-red-500 mx-auto flex items-center justify-center mb-2">
                            <i data-lucide="alert-triangle" class="w-5 h-5"></i>
                        </div>
                        <h3 class="text-sm font-bold text-red-700">Không thể đồng bộ danh sách</h3>
                        <p class="text-xs text-slate-500 mt-1 mb-3">Không tìm thấy hoặc không thể đọc tệp list.txt</p>
                        <button onclick="fetchAndRenderLinks()" class="px-3 py-1.5 bg-red-600 text-white text-xs font-semibold rounded-lg hover:bg-red-700 active:scale-95 transition">
                            Thử lại
                        </button>
                    </div>
                `;
                lucide.createIcons();
            }
        }

        // Render cấu trúc nhóm thẻ Card cho Mobile
        function renderGroups(groupsToRender, forceExpand = false) {
            const container = document.getElementById('groups-container');
            const noResults = document.getElementById('no-results');
            container.innerHTML = "";

            const folderKeys = Object.keys(groupsToRender);
            if (folderKeys.length === 0) {
                noResults.classList.remove('hidden');
                return;
            }
            noResults.classList.add('hidden');

            folderKeys.forEach((folder, idx) => {
                const meta = getFolderMeta(folder);
                const colors = getColorClasses(meta.color);
                const folderId = `folder-${folder.toLowerCase().replace(/[^a-z0-9]/g, '-')}`;
                const isExpanded = forceExpand || idx === 0; // Tự mở folder đầu tiên

                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl border border-slate-200/80 shadow-[0_1px_3px_rgba(0,0,0,0.03)] overflow-hidden transition-all duration-200";
                
                card.innerHTML = `
                    <!-- Header Thư mục - Nút bấm lớn tối thiểu 48px chuẩn Mobile -->
                    <button 
                        onclick="toggleFolder('${folderId}')" 
                        class="w-full flex items-center justify-between p-3.5 sm:p-4 text-left hover:bg-slate-50/80 active:bg-slate-100 transition-colors focus:outline-none ios-press select-none"
                    >
                        <div class="flex items-center gap-3 min-w-0 pr-2">
                            <div class="w-10 h-10 rounded-xl flex items-center justify-center ${colors.bg} ${colors.text} border ${colors.border} shrink-0 shadow-sm">
                                <i data-lucide="${meta.icon}" class="w-5 h-5"></i>
                            </div>
                            <div class="min-w-0">
                                <div class="flex items-center gap-2">
                                    <h2 class="text-sm font-bold text-slate-800 tracking-tight truncate">${meta.name}</h2>
                                    <span class="text-[10px] font-mono px-1.5 py-0.5 rounded-full ${colors.pill} font-semibold uppercase shrink-0">${folder}</span>
                                </div>
                                <p class="text-[11px] text-slate-400 font-medium truncate mt-0.5">${meta.desc} &bull; ${groupsToRender[folder].length} mục</p>
                            </div>
                        </div>
                        <div class="w-7 h-7 rounded-full bg-slate-100 flex items-center justify-center text-slate-400 shrink-0">
                            <i data-lucide="chevron-down" id="chevron-${folderId}" class="w-4 h-4 transition-transform duration-200 ${isExpanded ? 'rotate-180' : ''}"></i>
                        </div>
                    </button>
                    
                    <!-- Danh sách các link con bên trong (Touch-friendly 48px min height) -->
                    <div id="content-${folderId}" class="${isExpanded ? '' : 'hidden'} border-t border-slate-100 bg-slate-50/50 divide-y divide-slate-100">
                    </div>
                `;

                const listWrapper = card.querySelector(`#content-${folderId}`);
                groupsToRender[folder].forEach(link => {
                    const row = document.createElement('a');
                    row.href = link.path;
                    row.className = "flex items-center justify-between px-4 py-3 hover:bg-white active:bg-indigo-50/60 transition-colors duration-150 group min-h-[48px] select-none";
                    row.innerHTML = `
                        <div class="flex items-center gap-3 min-w-0 pr-2">
                            <div class="w-2 h-2 rounded-full ${colors.text.replace('text-', 'bg-')} opacity-60 group-hover:opacity-100 group-hover:scale-125 transition-all shrink-0"></div>
                            <div class="min-w-0">
                                <div class="text-xs sm:text-sm font-semibold text-slate-700 group-hover:text-indigo-600 transition-colors truncate">
                                    ${link.displayName}
                                </div>
                                <div class="text-[10px] font-mono text-slate-400 group-hover:text-slate-500 truncate mt-0.5">
                                    ${link.path}
                                </div>
                            </div>
                        </div>
                        <div class="flex items-center gap-1 text-slate-300 group-hover:text-indigo-500 transition-colors shrink-0">
                            <span class="text-[10px] font-medium text-slate-400 hidden sm:inline-block group-hover:text-indigo-500">Mở</span>
                            <i data-lucide="chevron-right" class="w-4 h-4 group-hover:translate-x-0.5 transition-transform"></i>
                        </div>
                    `;
                    listWrapper.appendChild(row);
                });

                container.appendChild(card);
            });

            // Vẽ lại toàn bộ icons Lucide
            lucide.createIcons();
        }

        // Tìm kiếm nhanh thời gian thực (Real-time Filter)
        function handleSearch(query) {
            const cleanQuery = query.trim().toLowerCase();
            const btnClear = document.getElementById('btn-clear-search');
            
            if (cleanQuery.length > 0) {
                btnClear.classList.remove('hidden');
            } else {
                btnClear.classList.add('hidden');
                renderGroups(allGroups, false);
                return;
            }

            const filteredGroups = {};
            for (const folder in allGroups) {
                const meta = getFolderMeta(folder);
                const matchingLinks = allGroups[folder].filter(link => {
                    return link.displayName.toLowerCase().includes(cleanQuery) ||
                           link.path.toLowerCase().includes(cleanQuery) ||
                           link.folder.toLowerCase().includes(cleanQuery) ||
                           meta.name.toLowerCase().includes(cleanQuery);
                });

                if (matchingLinks.length > 0) {
                    filteredGroups[folder] = matchingLinks;
                }
            }

            // Khi tìm kiếm, tự động mở tất cả kết quả khớp
            renderGroups(filteredGroups, true);
        }

        function clearSearch() {
            const input = document.getElementById('search-input');
            input.value = '';
            document.getElementById('btn-clear-search').classList.add('hidden');
            renderGroups(allGroups, false);
            input.focus();
        }

        // Khởi tạo
        document.addEventListener('DOMContentLoaded', () => {
            fetchAndRenderLinks();
        });
    </script>
</body>
</html>
