<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>🔔 BÁO THỨC ĐANG REO!</title>
  <link rel="icon" type="image/png" href="icons/icon48.png">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #020617;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .fullscreen-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .yt-fullscreen-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      background: #000;
    }
    .yt-fullscreen-layer iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .floating-header {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      pointer-events: none;
    }
    .floating-badge-box {
      pointer-events: auto;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 9999px;
      padding: 6px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .hud-icon-img {
      width: 28px;
      height: 28px;
      object-fit: contain;
      animation: shake 1s infinite;
    }
    .badge-ring {
      background: #ef4444;
      color: #fff;
      font-weight: 900;
      font-size: 0.75rem;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 9999px;
      animation: pulse 1s infinite;
    }
    .hud-time {
      font-family: monospace;
      font-size: 1.4rem;
      font-weight: 900;
      color: #f87171;
    }
    .hud-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: #e2e8f0;
      max-width: 240px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .hud-repeat {
      font-size: 0.75rem;
      font-weight: 800;
      background: #d97706;
      color: #fff;
      padding: 3px 8px;
      border-radius: 6px;
    }
    .hud-actions-top {
      pointer-events: auto;
      display: flex;
      gap: 8px;
    }
    .btn-stop-huge {
      background: #ef4444;
      color: #fff;
      border: 2px solid #fff;
      font-size: 0.95rem;
      font-weight: 900;
      padding: 8px 20px;
      border-radius: 9999px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(239, 68, 68, 0.7);
      animation: pulse 1.5s infinite;
      white-space: nowrap;
    }
    .btn-stop-huge:hover { background: #dc2626; }
    .btn-snooze-hud {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      color: #fff;
      border: 1.5px solid rgba(255, 255, 255, 0.3);
      font-size: 0.85rem;
      font-weight: 800;
      padding: 8px 16px;
      border-radius: 9999px;
      cursor: pointer;
      white-space: nowrap;
    }

    .tts-center-box, .web-center-box {
      position: relative;
      z-index: 10;
      background: rgba(15, 23, 42, 0.95);
      border: 2px solid #8b5cf6;
      border-radius: 24px;
      padding: 36px 32px;
      max-width: 620px;
      width: 90%;
      text-align: center;
      box-shadow: 0 25px 60px rgba(0,0,0,0.8), 0 0 50px rgba(139, 92, 246, 0.35);
    }
    .web-center-box {
      border-color: #10b981;
      box-shadow: 0 25px 60px rgba(0,0,0,0.8), 0 0 50px rgba(16, 185, 129, 0.35);
    }
    .tts-text {
      font-size: 1.45rem;
      font-weight: 700;
      line-height: 1.5;
      color: #f1f5f9;
      margin: 16px 0 24px;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }
    @keyframes shake {
      0%, 100% { transform: rotate(0deg); }
      20% { transform: rotate(-12deg); }
      40% { transform: rotate(12deg); }
      60% { transform: rotate(-8deg); }
      80% { transform: rotate(8deg); }
    }
  </style>
</head>
<body>
  <div class="fullscreen-container">
    <div class="floating-header">
      <div class="floating-badge-box">
        <img src="icons/icon48.png" alt="Alarm Clock" class="hud-icon-img">
        <span class="badge-ring">🔔 ĐANG REO</span>
        <span id="hudTime" class="hud-time">00:00:00</span>
        <span id="hudTitle" class="hud-title">Báo thức</span>
        <span id="hudRepeat" class="hud-repeat">🔁 10 lần</span>
      </div>

      <div class="hud-actions-top">
        <button id="btnStop" class="btn-stop-huge">🔕 TẮT BÁO THỨC</button>
        <button id="btnSnooze" class="btn-snooze-hud">⏰ Báo lại 5p</button>
      </div>
    </div>

    <!-- YouTube Layer -->
    <div id="ytLayer" class="yt-fullscreen-layer" style="display: none;">
      <iframe id="ytIframe"
        referrerpolicy="strict-origin-when-cross-origin"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen>
      </iframe>
    </div>

    <!-- TTS Mode Box -->
    <div id="ttsLayer" class="tts-center-box" style="display: none;">
      <div id="ttsGenderIcon" style="font-size: 3.5rem; margin-bottom: 8px;">🗣️</div>
      <div class="hud-time" id="ttsClock" style="font-size: 2.5rem; margin-bottom: 8px;">00:00:00</div>
      <h2 id="ttsTitle" style="font-size: 1.3rem; color: #a78bfa;">Lời Nhắc Báo Thức</h2>
      <div id="ttsText" class="tts-text">...</div>
      <div id="ttsGenderBadge" style="display: inline-block; font-size: 0.8rem; font-weight: 700; background: #6d28d9; padding: 4px 12px; border-radius: 9999px; margin-bottom: 10px;">
        Giọng Nữ Hoài My
      </div>
      <div id="ttsRepeatStatus" style="font-size: 0.85rem; color: #cbd5e1; font-weight: 600;">Lặp lại: 1 / 10</div>
    </div>
  </div>

  <script src="db.js"></script>
  <script src="audio.js"></script>
  <script src="ring.js"></script>
</body>
</html>
