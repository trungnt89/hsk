<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>
  <!-- Bell ears -->
  <circle cx="28" cy="28" r="14" fill="url(#metal)" stroke="#334155" stroke-width="4"/>
  <circle cx="100" cy="28" r="14" fill="url(#metal)" stroke="#334155" stroke-width="4"/>
  <!-- Bell feet -->
  <line x1="36" y1="106" x2="22" y2="120" stroke="#475569" stroke-width="8" stroke-linecap="round"/>
  <line x1="92" y1="106" x2="106" y2="120" stroke="#475569" stroke-width="8" stroke-linecap="round"/>
  <!-- Clock body -->
  <circle cx="64" cy="68" r="48" fill="url(#grad)" stroke="#991b1b" stroke-width="6"/>
  <!-- Clock face -->
  <circle cx="64" cy="68" r="38" fill="#ffffff"/>
  <!-- Hour marks -->
  <circle cx="64" cy="38" r="3" fill="#1e293b"/>
  <circle cx="64" cy="98" r="3" fill="#1e293b"/>
  <circle cx="34" cy="68" r="3" fill="#1e293b"/>
  <circle cx="94" cy="68" r="3" fill="#1e293b"/>
  <!-- Hands -->
  <line x1="64" y1="68" x2="64" y2="46" stroke="#0f172a" stroke-width="4" stroke-linecap="round"/>
  <line x1="64" y1="68" x2="80" y2="68" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
  <circle cx="64" cy="68" r="5" fill="#dc2626"/>
</svg>