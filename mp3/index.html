<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- CỰC KỲ QUAN TRỌNG: Sửa lỗi YouTube Error 153 (Video player configuration error) do thiếu referrer policy -->
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Báo Thức YouTube - Hẹn Giờ Nhạc YouTube</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22%20width=%22100%22%20height=%22100%22><text y=%22.9em%22 font-size=%2290%22>⏰</text></svg>">
    <style>
        :root {
            --bg: #0f172a;
            --surface: #1e293b;
            --surface-hover: #334155;
            --primary: #ef4444;
            --primary-hover: #dc2626;
            --accent: #38bdf8;
            --text: #f8fafc;
            --text-sub: #94a3b8;
            --border: #334155;
            --card-radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 540px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        header {
            text-align: center;
            padding: 10px 0 2px;
        }

        .app-title {
            font-size: 1.45rem;
            font-weight: 800;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #fff;
        }

        .app-title span.yt-tag {
            background: #ef4444;
            color: #fff;
            font-size: 0.72rem;
            padding: 2px 8px;
            border-radius: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Đồng hồ số hiện tại */
        .clock-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--card-radius);
            padding: 16px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.25);
        }

        .clock-time {
            font-size: 2.8rem;
            font-weight: 800;
            font-variant-numeric: tabular-nums;
            letter-spacing: 1px;
            color: #38bdf8;
        }

        .clock-date {
            font-size: 0.9rem;
            color: var(--text-sub);
            margin-top: 2px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--card-radius);
            padding: 18px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
        }

        .card-title {
            font-size: 1.05rem;
            font-weight: 700;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 12px;
        }

        .form-label {
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-sub);
        }

        .form-input {
            width: 100%;
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 14px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-input:focus {
            border-color: #38bdf8;
        }

        .form-time-input {
            font-size: 1.5rem;
            font-weight: 700;
            text-align: center;
            letter-spacing: 2px;
            padding: 8px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.85rem;
            color: var(--text);
            cursor: pointer;
            user-select: none;
        }

        .checkbox-label input {
            accent-color: #ef4444;
            width: 17px;
            height: 17px;
        }

        .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 14px;
        }

        .btn {
            flex: 1;
            padding: 12px 14px;
            border-radius: 10px;
            border: none;
            font-size: 0.92rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background: #ef4444;
            color: #fff;
        }
        .btn-primary:hover { background: #dc2626; }

        .btn-secondary {
            background: #334155;
            color: #f8fafc;
        }
        .btn-secondary:hover { background: #475569; }

        .btn-accent {
            background: #0284c7;
            color: #fff;
        }
        .btn-accent:hover { background: #0369a1; }

        /* Nút mẫu gợi ý YouTube */
        .preset-links-row {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 6px;
        }

        .preset-label {
            font-size: 0.78rem;
            color: var(--text-sub);
            font-weight: 600;
        }

        .preset-pill {
            background: #0f172a;
            border: 1px solid var(--border);
            color: #38bdf8;
            font-size: 0.78rem;
            font-weight: 600;
            padding: 5px 12px;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.15s ease;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .preset-pill:hover, .preset-pill.active {
            background: #1e293b;
            border-color: #38bdf8;
            color: #fff;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.25);
        }

        /* Danh sách mốc báo thức */
        .alarm-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .alarm-item {
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .alarm-item.disabled {
            opacity: 0.5;
        }

        .alarm-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow: hidden;
        }

        .alarm-time {
            font-size: 1.45rem;
            font-weight: 800;
            color: #38bdf8;
            letter-spacing: 1px;
        }

        .alarm-title {
            font-size: 0.82rem;
            color: var(--text-sub);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .alarm-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toggle-switch {
            position: relative;
            width: 44px;
            height: 24px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            inset: 0;
            background-color: #475569;
            transition: .2s;
            border-radius: 24px;
        }

        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .2s;
            border-radius: 50%;
        }

        input:checked + .toggle-slider {
            background-color: #22c55e;
        }

        input:checked + .toggle-slider:before {
            transform: translateX(20px);
        }

        .btn-icon {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-sub);
            border-radius: 8px;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .btn-icon:hover {
            color: #ef4444;
            border-color: #ef4444;
        }

        /* KHUNG PHÁT YOUTUBE MASTER DUY TRÌ LIÊN TỤC TRONG DOM (KHÔNG BAO GIỜ BỊ XÓA HAY APPEND LẠI) */
        #ytMasterContainer {
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            transition: all 0.2s ease;
        }

        /* 1. Trạng thái xem thử trong Form */
        #ytMasterContainer.mode-preview {
            display: block;
            width: 100%;
            aspect-ratio: 16 / 9;
            margin-top: 10px;
            position: static;
        }

        /* 2. Trạng thái reo chuông báo thức toàn màn hình */
        #ytMasterContainer.mode-ringing {
            display: block;
            position: fixed;
            top: 48%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: calc(100% - 32px);
            max-width: 480px;
            aspect-ratio: 16 / 9;
            z-index: 1000000;
            box-shadow: 0 8px 36px rgba(239, 68, 68, 0.45);
        }

        /* 3. Trạng thái chờ ngầm (không tháo DOM để giữ Audio session) */
        #ytMasterContainer.mode-idle {
            position: fixed;
            bottom: -9999px;
            left: -9999px;
            width: 200px;
            height: 112px;
            opacity: 0.01;
            pointer-events: none;
            z-index: -1;
        }

        .yt-preplay-banner {
            background: #1e3a8a;
            border: 1px solid #3b82f6;
            border-radius: 8px;
            padding: 8px 12px;
            margin-top: 8px;
            font-size: 0.8rem;
            color: #bfdbfe;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Overlay khi chuông reo */
        .alarm-ringing-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.98);
            z-index: 999999;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 40px 16px 48px;
            text-align: center;
        }

        .ring-time {
            font-size: 3.8rem;
            font-weight: 900;
            color: #ef4444;
            animation: pulse 1s infinite;
            letter-spacing: 1px;
        }

        .ring-title {
            font-size: 1.1rem;
            color: #f8fafc;
            margin: 6px 0 16px;
            max-width: 90%;
            word-break: break-word;
        }

        /* Chỗ trống giữ chỗ layout cho video đang reo ở giữa */
        .ring-video-placeholder {
            width: 100%;
            max-width: 480px;
            aspect-ratio: 16 / 9;
            margin: 0 auto;
        }

        .btn-stop-alarm {
            background: #ef4444;
            color: #fff;
            font-size: 1.25rem;
            font-weight: 800;
            padding: 16px 40px;
            border-radius: 50px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 24px rgba(239, 68, 68, 0.6);
            transition: transform 0.15s;
            z-index: 1000002;
        }

        .btn-stop-alarm:active {
            transform: scale(0.95);
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.04); opacity: 0.88; }
        }

        .empty-hint {
            text-align: center;
            color: var(--text-sub);
            padding: 20px 0;
            font-size: 0.88rem;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="app-title">
            <span>⏰ Báo Thức YouTube</span>
            <span class="yt-tag">Fix Error 153</span>
        </div>
    </header>

    <!-- ĐỒNG HỒ HIỆN TẠI -->
    <div class="clock-card">
        <div class="clock-time" id="clockTime">00:00:00</div>
        <div class="clock-date" id="clockDate">Đang cập nhật...</div>
    </div>

    <!-- FORM THIẾT LẬP BÁO THỨC -->
    <div class="card">
        <div class="card-title">
            <span>➕ Hẹn giờ báo thức mới</span>
        </div>

        <div class="form-group">
            <label class="form-label" for="alarmTime">Giờ báo thức (24h)</label>
            <input type="time" id="alarmTime" class="form-input form-time-input" required>
        </div>

        <div class="form-group">
            <label class="form-label" for="ytUrl">Link hoặc ID YouTube</label>
            <input type="text" id="ytUrl" class="form-input" placeholder="Dán link YouTube (vd: https://youtu.be/... hoặc ID)" oninput="onYtUrlChange()">
            <div class="preset-links-row">
                <span class="preset-label">⚡ Nhạc mẫu:</span>
                <button type="button" class="preset-pill" onclick="applySamplePreset('https://www.youtube.com/watch?v=fuXfT4Rv_WM', 'Nhạc Báo Thức 1 (fuXfT4Rv_WM)')">
                    🎵 Mẫu 1 (fuXfT4Rv_WM)
                </button>
                <button type="button" class="preset-pill" onclick="applySamplePreset('https://www.youtube.com/watch?v=o8GrqUSdzi0', 'Nhạc Báo Thức 2 (o8GrqUSdzi0)')">
                    🎵 Mẫu 2 (o8GrqUSdzi0)
                </button>
            </div>
        </div>

        <div class="form-group">
            <label class="form-label" for="alarmLabel">Tên mốc hẹn (tùy chọn)</label>
            <input type="text" id="alarmLabel" class="form-input" placeholder="Ví dụ: Báo thức buổi sáng, Tập thể dục...">
        </div>

        <div style="display: flex; flex-direction: column; gap: 8px; margin: 10px 0;">
            <label class="checkbox-label">
                <input type="checkbox" id="preplay30s" checked>
                <span>⚡ Phát thử 30s rồi Pause khi lưu (đến giờ tự động Play)</span>
            </label>
            <label class="checkbox-label">
                <input type="checkbox" id="continuousLoop" checked>
                <span>🔁 Lặp lại liên tục cho đến khi bấm tắt</span>
            </label>
        </div>

        <!-- KHUNG PHÁT YOUTUBE MASTER DUY NHẤT (CỐ ĐỊNH, KHÔNG BAO GIỜ DI CHUYỂN DOM) -->
        <div id="ytMasterContainer" class="mode-idle">
            <iframe id="ytIframe"
                title="YouTube Background Alarm Engine"
                referrerpolicy="strict-origin-when-cross-origin"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                playsinline="1"
                webkit-playsinline="1"
                allowfullscreen
                style="width: 100%; height: 100%; border: none; display: block;">
            </iframe>
        </div>

        <div id="preplayStatus" class="yt-preplay-banner" style="display: none;">
            <span id="preplayText">Đang phát thử...</span>
            <button type="button" class="btn btn-secondary" style="padding: 4px 10px; font-size: 0.75rem; flex: none;" onclick="pausePreplay()">⏸️ Pause ngay</button>
        </div>

        <div class="btn-row">
            <button type="button" class="btn btn-accent" id="btnTest" onclick="startPreplay(30)">
                <span>▶️ Thử 30s</span>
            </button>
            <button type="button" class="btn btn-primary" onclick="saveAlarm()">
                <span>💾 Lưu Báo Thức</span>
            </button>
        </div>
    </div>

    <!-- DANH SÁCH BÁO THỨC ĐÃ LƯU -->
    <div class="card">
        <div class="card-title" style="display: flex; justify-content: space-between; align-items: center;">
            <span>📋 Danh sách báo thức</span>
            <button type="button" class="preset-pill" style="font-size: 0.74rem; padding: 4px 10px;" onclick="loadSampleAlarms()">
                ➕ Nạp 2 mốc mẫu
            </button>
        </div>
        <div class="alarm-list" id="alarmList">
            <div class="empty-hint">Chưa có mốc báo thức nào. Hãy thêm mốc ở trên!</div>
        </div>
    </div>
</div>

<!-- MÀN HÌNH BÁO THỨC CHUÔNG REO TOÀN MÀN HÌNH -->
<div class="alarm-ringing-overlay" id="ringOverlay">
    <div>
        <div class="ring-time" id="ringTime">00:00</div>
        <div class="ring-title" id="ringTitle">Báo thức YouTube đang phát!</div>
    </div>
    
    <!-- Chỗ trống giữ vị trí cho video reo ở giữa -->
    <div class="ring-video-placeholder"></div>

    <button type="button" class="btn-stop-alarm" onclick="stopAlarm()">
        🔕 TẮT BÁO THỨC
    </button>
</div>

<script>
    // --- QUẢN LÝ DỮ LIỆU BÁO THỨC (LOCALSTORAGE) ---
    const STORAGE_KEY = 'yt_alarms_simple_v1';
    let alarms = [];
    let activeRingingAlarm = null;
    let preplayTimer = null;
    let preplayInterval = null;
    let audioCtx = null;
    let backupOscillator = null;
    let backupGain = null;
    let backupChimeInterval = null;

    // CÁC MẪU CẤU HÌNH YOUTUBE CÓ SẴN
    const SAMPLE_PRESETS = [
        {
            url: 'https://www.youtube.com/watch?v=fuXfT4Rv_WM',
            vid: 'fuXfT4Rv_WM',
            label: 'Nhạc Báo Thức 1 (fuXfT4Rv_WM)'
        },
        {
            url: 'https://www.youtube.com/watch?v=o8GrqUSdzi0',
            vid: 'o8GrqUSdzi0',
            label: 'Nhạc Báo Thức 2 (o8GrqUSdzi0)'
        }
    ];

    // Load dữ liệu khi mở trang
    try {
        const data = localStorage.getItem(STORAGE_KEY);
        if (data) alarms = JSON.parse(data);
    } catch (e) {
        alarms = [];
    }

    // Áp dụng bài mẫu vào form
    function applySamplePreset(url, label) {
        unlockAudio();
        document.getElementById('ytUrl').value = url;
        document.getElementById('alarmLabel').value = label;
        onYtUrlChange();

        // Cập nhật trạng thái active của nút mẫu
        document.querySelectorAll('.preset-pill').forEach(pill => {
            if (pill.innerText.includes(extractYouTubeId(url))) {
                pill.classList.add('active');
            } else {
                pill.classList.remove('active');
            }
        });
    }

    // Nạp sẵn 2 mốc báo thức mẫu vào danh sách
    function loadSampleAlarms() {
        unlockAudio();
        const now = new Date();

        // Mốc 1: Sau 2 phút
        const t1 = new Date(now.getTime() + 2 * 60000);
        const h1 = String(t1.getHours()).padStart(2, '0');
        const m1 = String(t1.getMinutes()).padStart(2, '0');

        // Mốc 2: Sau 5 phút
        const t2 = new Date(now.getTime() + 5 * 60000);
        const h2 = String(t2.getHours()).padStart(2, '0');
        const m2 = String(t2.getMinutes()).padStart(2, '0');

        const sample1 = {
            id: 'sample_1_' + Date.now(),
            time: `${h1}:${m1}`,
            url: SAMPLE_PRESETS[0].url,
            vid: SAMPLE_PRESETS[0].vid,
            label: SAMPLE_PRESETS[0].label,
            loop: true,
            enabled: true
        };

        const sample2 = {
            id: 'sample_2_' + Date.now(),
            time: `${h2}:${m2}`,
            url: SAMPLE_PRESETS[1].url,
            vid: SAMPLE_PRESETS[1].vid,
            label: SAMPLE_PRESETS[1].label,
            loop: true,
            enabled: true
        };

        alarms.push(sample1, sample2);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(alarms));
        renderAlarms();

        // Nạp mẫu 1 vào khung player
        applySamplePreset(SAMPLE_PRESETS[0].url, SAMPLE_PRESETS[0].label);
    }

    // Trích xuất ID YouTube chuẩn xác
    function extractYouTubeId(url) {
        if (!url) return '';
        url = url.trim();
        if (/^[a-zA-Z0-9_-]{11}$/.test(url)) return url;
        const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/;
        const match = url.match(regExp);
        return (match && match[2].length === 11) ? match[2] : '';
    }

    // Đảm bảo Web Audio không ngủ gật trên Safari/iOS
    function unlockAudio() {
        if (!audioCtx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (AudioContext) audioCtx = new AudioContext();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
        if (navigator.wakeLock && navigator.wakeLock.request) {
            navigator.wakeLock.request('screen').catch(() => {});
        }
    }

    // Chuông phụ dự phòng (Web Audio Chime) đề phòng trường hợp video bị gỡ bản quyền hoặc lỗi mạng
    function startBackupAlarmChime() {
        unlockAudio();
        stopBackupAlarmChime();
        if (!audioCtx) return;

        let noteIndex = 0;
        const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6

        backupChimeInterval = setInterval(() => {
            if (!activeRingingAlarm) {
                stopBackupAlarmChime();
                return;
            }
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(notes[noteIndex % notes.length], audioCtx.currentTime);
                noteIndex++;

                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.36);
            } catch (e) {}
        }, 400);
    }

    function stopBackupAlarmChime() {
        if (backupChimeInterval) {
            clearInterval(backupChimeInterval);
            backupChimeInterval = null;
        }
    }

    // Cập nhật đồng hồ thời gian thực
    function updateClock() {
        const now = new Date();
        const h = String(now.getHours()).padStart(2, '0');
        const m = String(now.getMinutes()).padStart(2, '0');
        const s = String(now.getSeconds()).padStart(2, '0');
        const timeStr = `${h}:${m}:${s}`;
        document.getElementById('clockTime').innerText = timeStr;

        const options = { weekday: 'long', year: 'numeric', month: 'numeric', day: 'numeric' };
        document.getElementById('clockDate').innerText = now.toLocaleDateString('vi-VN', options);

        // Kiểm tra báo thức tại giây 00
        if (s === '00' && !activeRingingAlarm) {
            checkAlarms(`${h}:${m}`);
        }
    }

    setInterval(updateClock, 1000);
    updateClock();

    // Điền giờ mặc định vào ô nhập (hiện tại + 5 phút)
    function setDefaultTime() {
        const d = new Date();
        d.setMinutes(d.getMinutes() + 5);
        const hh = String(d.getHours()).padStart(2, '0');
        const mm = String(d.getMinutes()).padStart(2, '0');
        const el = document.getElementById('alarmTime');
        if (el && !el.value) el.value = `${hh}:${mm}`;
    }
    setDefaultTime();

    // XÂY DỰNG LINK EMBED YOUTUBE CHUẨN (KHÔNG LỖI ERROR 153)
    // Lưu ý: Không dùng youtube-nocookie.com vì gây ra Error 153 trên trình duyệt có referrer check
    function buildYouTubeEmbedUrl(vid, autoplay = 0, loop = 0) {
        // Dùng www.youtube.com chuẩn
        let url = `https://www.youtube.com/embed/${vid}?enablejsapi=1&playsinline=1&autoplay=${autoplay}&mute=0&controls=1&rel=0`;
        if (loop) {
            url += `&loop=1&playlist=${vid}`;
        }
        return url;
    }

    // Điều khiển iframe YouTube qua postMessage
    function sendYtCommand(func, args = []) {
        const iframe = document.getElementById('ytIframe');
        if (iframe && iframe.contentWindow) {
            iframe.contentWindow.postMessage(JSON.stringify({
                event: 'command',
                func: func,
                args: args
            }), '*');
        }
    }

    function onYtUrlChange() {
        const url = document.getElementById('ytUrl').value;
        const vid = extractYouTubeId(url);
        const container = document.getElementById('ytMasterContainer');
        const iframe = document.getElementById('ytIframe');

        if (vid) {
            container.className = 'mode-preview';
            const targetSrc = buildYouTubeEmbedUrl(vid, 0, 0);
            if (!iframe.src || !iframe.src.includes(vid)) {
                iframe.src = targetSrc;
            }
        }
    }

    // Phát thử 30s rồi Pause
    function startPreplay(seconds = 30) {
        unlockAudio();
        const url = document.getElementById('ytUrl').value;
        const vid = extractYouTubeId(url);
        if (!vid) {
            alert('Vui lòng dán link hoặc mã ID YouTube hợp lệ!');
            return;
        }

        const container = document.getElementById('ytMasterContainer');
        const iframe = document.getElementById('ytIframe');
        const banner = document.getElementById('preplayStatus');
        const preplayText = document.getElementById('preplayText');

        container.className = 'mode-preview';
        banner.style.display = 'flex';

        const loop = document.getElementById('continuousLoop').checked ? 1 : 0;
        const targetSrc = buildYouTubeEmbedUrl(vid, 1, loop);

        if (!iframe.src || !iframe.src.includes(vid)) {
            iframe.src = targetSrc;
        }

        // Kích hoạt phát âm thanh tối đa
        const burstUnlock = () => {
            sendYtCommand('unMute');
            sendYtCommand('setVolume', 100);
            sendYtCommand('playVideo');
        };
        setTimeout(burstUnlock, 300);
        setTimeout(burstUnlock, 800);

        let remain = seconds;
        preplayText.innerText = `🔊 Đang phát thử: còn ${remain}s (sẽ tự Pause)...`;

        clearInterval(preplayInterval);
        clearTimeout(preplayTimer);

        preplayInterval = setInterval(() => {
            remain--;
            if (remain > 0) {
                preplayText.innerText = `🔊 Đang phát thử: còn ${remain}s (sẽ tự Pause)...`;
            } else {
                pausePreplay();
            }
        }, 1000);

        preplayTimer = setTimeout(pausePreplay, seconds * 1000);
    }

    // Tạm dừng phát thử & chuyển sang trạng thái chờ ngầm (mode-idle)
    function pausePreplay() {
        clearInterval(preplayInterval);
        clearTimeout(preplayTimer);
        sendYtCommand('pauseVideo');

        const banner = document.getElementById('preplayStatus');
        const preplayText = document.getElementById('preplayText');
        const container = document.getElementById('ytMasterContainer');

        if (preplayText) preplayText.innerText = '⏸️ Đã Pause! Đến giờ hẹn sẽ tự động phát tiếp.';

        setTimeout(() => {
            if (banner) banner.style.display = 'none';
            // Chuyển container về chế độ chờ ngầm nhưng KHÔNG tháo iframe khỏi DOM
            if (!activeRingingAlarm) {
                container.className = 'mode-idle';
            }
        }, 1200);
    }

    // Lưu mốc báo thức
    function saveAlarm() {
        unlockAudio();
        const timeVal = document.getElementById('alarmTime').value;
        const urlVal = document.getElementById('ytUrl').value;
        const labelVal = document.getElementById('alarmLabel').value.trim();
        const preplay = document.getElementById('preplay30s').checked;
        const loop = document.getElementById('continuousLoop').checked;

        if (!timeVal) {
            alert('Vui lòng chọn giờ báo thức!');
            return;
        }
        const vid = extractYouTubeId(urlVal);
        if (!vid) {
            alert('Vui lòng dán link YouTube hợp lệ!');
            return;
        }

        const newAlarm = {
            id: Date.now().toString(),
            time: timeVal,
            url: urlVal,
            vid: vid,
            label: labelVal || `YouTube (${vid})`,
            loop: loop,
            enabled: true
        };

        alarms.push(newAlarm);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(alarms));
        renderAlarms();

        if (preplay) {
            startPreplay(30);
        } else {
            // Nạp trước video vào iframe ở trạng thái dừng
            const iframe = document.getElementById('ytIframe');
            iframe.src = buildYouTubeEmbedUrl(vid, 0, loop ? 1 : 0);
            alert(`Đã lưu báo thức ${timeVal}!`);
        }
    }

    // Bật/Tắt mốc báo thức
    function toggleAlarm(id) {
        unlockAudio();
        const item = alarms.find(a => a.id === id);
        if (item) {
            item.enabled = !item.enabled;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(alarms));
            renderAlarms();
            if (item.enabled) {
                document.getElementById('ytUrl').value = item.url;
                onYtUrlChange();
            }
        }
    }

    // Xóa mốc báo thức
    function deleteAlarm(id) {
        if (!confirm('Bạn có chắc muốn xóa mốc báo thức này?')) return;
        alarms = alarms.filter(a => a.id !== id);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(alarms));
        renderAlarms();
    }

    // Thử báo thức ngay lập tức
    function triggerAlarmNow(id) {
        unlockAudio();
        const item = alarms.find(a => a.id === id);
        if (item) triggerAlarm(item);
    }

    // Hiển thị danh sách
    function renderAlarms() {
        const listEl = document.getElementById('alarmList');
        if (!alarms || alarms.length === 0) {
            listEl.innerHTML = `
                <div class="empty-hint">
                    Chưa có mốc báo thức nào.<br>
                    <button type="button" class="preset-pill" style="margin-top: 8px;" onclick="loadSampleAlarms()">
                        ⚡ Nạp 2 mốc mẫu ngay
                    </button>
                </div>`;
            return;
        }

        // Sắp xếp theo giờ tăng dần
        alarms.sort((a, b) => a.time.localeCompare(b.time));

        listEl.innerHTML = alarms.map(a => `
            <div class="alarm-item ${a.enabled ? '' : 'disabled'}">
                <div class="alarm-info">
                    <div class="alarm-time">${a.time}</div>
                    <div class="alarm-title">🎵 ${escapeHtml(a.label)}</div>
                </div>
                <div class="alarm-actions">
                    <button type="button" class="btn-icon" title="Thử phát ngay" onclick="triggerAlarmNow('${a.id}')">▶️</button>
                    <button type="button" class="btn-icon" title="Xóa" onclick="deleteAlarm('${a.id}')">🗑️</button>
                    <label class="toggle-switch">
                        <input type="checkbox" ${a.enabled ? 'checked' : ''} onchange="toggleAlarm('${a.id}')">
                        <span class="toggle-slider"></span>
                    </label>
                </div>
            </div>
        `).join('');
    }

    function escapeHtml(str) {
        return (str || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[m]);
    }

    // Kiểm tra giờ hẹn
    function checkAlarms(currentHHMM) {
        const match = alarms.find(a => a.enabled && a.time === currentHHMM);
        if (match) {
            triggerAlarm(match);
        }
    }

    // Kích hoạt chuông reo báo thức (KHÔNG THÁO RÁP DOM IFRAME)
    function triggerAlarm(alarm) {
        unlockAudio();
        activeRingingAlarm = alarm;

        const overlay = document.getElementById('ringOverlay');
        const ringTime = document.getElementById('ringTime');
        const ringTitle = document.getElementById('ringTitle');
        const container = document.getElementById('ytMasterContainer');
        const iframe = document.getElementById('ytIframe');

        ringTime.innerText = alarm.time;
        ringTitle.innerText = `🎵 ${alarm.label || 'Báo thức YouTube'}`;

        // Hiển thị modal reo chuông
        overlay.style.display = 'flex';

        // CHUYỂN CLASS CONTAINER SANG MODE RINGING (NỔI LÊN GIỮA MÀN HÌNH MÀ KHÔNG THÁO DOM!)
        container.className = 'mode-ringing';

        // Đảm bảo iframe có src đúng video
        const targetSrc = buildYouTubeEmbedUrl(alarm.vid, 1, alarm.loop ? 1 : 0);
        if (!iframe.src || !iframe.src.includes(alarm.vid)) {
            iframe.src = targetSrc;
        }

        // Lệnh phát âm thanh liên tục
        const burstPlay = () => {
            sendYtCommand('unMute');
            sendYtCommand('setVolume', 100);
            sendYtCommand('playVideo');
        };
        burstPlay();
        setTimeout(burstPlay, 400);
        setTimeout(burstPlay, 1000);
        setTimeout(burstPlay, 2000);

        // Chuông phụ dự phòng: Nếu sau 3.5 giây video không thể phát (do bản quyền hoặc mạng), chuông chimes dự phòng sẽ kêu
        setTimeout(() => {
            if (activeRingingAlarm) {
                startBackupAlarmChime();
            }
        }, 3500);
    }

    // Tắt chuông báo thức
    function stopAlarm() {
        activeRingingAlarm = null;
        stopBackupAlarmChime();
        sendYtCommand('pauseVideo');

        const overlay = document.getElementById('ringOverlay');
        const container = document.getElementById('ytMasterContainer');

        overlay.style.display = 'none';

        // Đưa container về chế độ ngầm hoặc preview
        const currentInputVid = extractYouTubeId(document.getElementById('ytUrl').value);
        if (currentInputVid) {
            container.className = 'mode-preview';
        } else {
            container.className = 'mode-idle';
        }
    }

    // Lắng nghe thông điệp từ YouTube API để tắt chuông phụ khi video phát thành công
    window.addEventListener('message', (event) => {
        try {
            const data = (typeof event.data === 'string') ? JSON.parse(event.data) : event.data;
            if (data && data.event === 'onStateChange' && data.info === 1) { // 1 = YT.PlayerState.PLAYING
                stopBackupAlarmChime();
            }
        } catch (e) {}
    });

    // Mở khóa âm thanh lần đầu khi người dùng chạm bất kỳ đâu
    ['click', 'touchstart'].forEach(evt => {
        document.addEventListener(evt, unlockAudio, { once: true, passive: true });
    });

    renderAlarms();
</script>
</body>
</html>
