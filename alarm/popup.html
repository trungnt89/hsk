<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Báo Thức Thông Minh Pro</title>
  <link rel="stylesheet" href="popup.css">
<script src="/_aistudio-iframe.js?v=2c34bde1"></script></head>
<body>
  <div class="popup-container">
    <!-- Header with alarm clock icon -->
    <div class="header">
      <div class="brand">
        <img src="icons/icon48.png" alt="Alarm Clock" class="brand-icon">
        <span class="title">Báo Thức Pro</span>
      </div>
      <button id="btnOptions" class="btn-icon" title="Mở bảng cài đặt đầy đủ">⚙️</button>
    </div>

    <!-- Live Clock -->
    <div class="clock-box">
      <div id="liveClock" class="clock-time">00:00:00</div>
      <div id="liveDate" class="clock-date">Đang tải...</div>
    </div>

    <!-- Quick Add Form with Type Selection -->
    <div class="quick-add-section">
      <div class="quick-type-tabs">
        <button type="button" class="tab-btn active" data-type="website">🌐 Website</button>
        <button type="button" class="tab-btn" data-type="tts">🗣️ TTS</button>
        <button type="button" class="tab-btn" data-type="youtube">🎬 YouTube</button>
      </div>

      <div class="quick-add-box">
        <input type="time" id="quickTimeInput" class="time-input" required>
        <input type="text" id="quickTitleInput" class="text-input" placeholder="Tiêu đề...">
      </div>

      <div id="quickWebsiteRow" class="quick-sub-row">
        <input type="url" id="quickWebUrlInput" class="text-input text-input-full" placeholder="https://vnexpress.net, trello.com...">
      </div>

      <div id="quickTtsRow" class="quick-sub-row" style="display: none;">
        <select id="quickGenderSelect" class="gender-mini-select" style="min-width: 145px; font-weight: 700;">
          <option value="azure_male" selected>👨 Nam Azure (Mặc định)</option>
          <option value="azure_female">👩 Nữ của Azure</option>
          <option value="browser_default">🌐 Mặc định trình duyệt</option>
        </select>
        <input type="text" id="quickTtsTextInput" class="text-input" placeholder="Nội dung nhắc nhở...">
      </div>

      <div id="quickYtRow" class="quick-sub-row" style="display: none;">
        <input type="text" id="quickYtUrlInput" class="text-input text-input-full" placeholder="Link video YouTube hoặc ID...">
      </div>

      <button id="btnQuickAdd" class="btn-add-full">➕ Thêm Mốc Báo Thức Nhanh</button>
    </div>

    <!-- Alarm List -->
    <div class="list-header">
      <span>Danh sách (<span id="alarmCount">0</span>)</span>
      <button id="btnRefreshList" class="btn-link" title="Làm mới">🔄 Làm mới</button>
    </div>
    <div id="alarmList" class="alarm-list">
      <div class="loading">Đang đọc dữ liệu...</div>
    </div>

    <!-- Footer -->
    <div class="footer">
      <button id="btnFullDashboard" class="btn-primary-full">
        Mở Bảng Quản Lý & Cài Đặt Chi Tiết ↗
      </button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
