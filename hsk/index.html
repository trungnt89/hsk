<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HSK Flashcards</title>
    <script src="../com/HanVietData.js"></script>
	<script src="../com/util.js"></script>
	<script src="../com/TTSClient.js"></script>
    <script src="typing.js" defer></script>
    <script>
        (function() {
            const scripts = ['https://hsk-gilt.vercel.app/com/assistive.js'];
            scripts.forEach(src => {
                const script = document.createElement('script');
                script.src = src;
                script.async = false;
                document.head.appendChild(script);
            });
        })();
    </script>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --accent: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: manipulation;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
            user-select: none;
            overflow-x: hidden;
            overscroll-behavior: none;
        }

        .container {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-top: 5px;
        }

        .header {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 2px;
        }

        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            gap: 8px;
            padding: 0 4px;
        }

        .top-row h1 {
            color: var(--primary);
            font-size: 1.35rem;
            font-weight: 800;
            margin: 0;
            letter-spacing: -0.025em;
            line-height: 1;
        }

        .top-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .select-box {
            padding: 4px 8px;
            border-radius: 12px;
            border: 1px solid #cbd5e1;
            font-size: 0.8rem;
            font-weight: 600;
            background-color: white;
            color: #334155;
            cursor: pointer;
            outline: none;
            height: 32px;
            line-height: normal;
        }

        .toggle-btn-icon {
            background-color: white;
            border: 1px solid #cbd5e1;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            color: #334155;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            outline: none;
        }

        .toggle-btn-icon:hover {
            background-color: #f1f5f9;
            border-color: #cbd5e1;
        }

        .toggle-btn-icon.active {
            background-color: #22c55e;
            color: white;
            border-color: #22c55e;
            box-shadow: 0 2px 4px rgba(34, 197, 94, 0.15);
        }

        .pagination-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 5px 10px;
            background-color: #f1f5f9;
            border-radius: 12px;
            gap: 10px;
        }

        .pagination-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .pagination-item label {
            font-size: 0.75rem;
            font-weight: 600;
            color: #64748b;
        }

        .progress-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 0 5px;
        }

        .progress {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .stats {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .flashcard-wrapper {
            perspective: 1000px;
            width: 100%;
            height: 400px;
            cursor: pointer;
            position: relative;
            touch-action: none;
        }

        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            border-radius: 20px;
        }

        .flashcard.flipped {
            transform: rotateY(180deg);
        }

        .flashcard.flipped-vertical {
            transform: rotateX(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            background: var(--card-bg);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            border: 1px solid #e2e8f0;
        }

        .card-back {
            transform: rotateY(180deg);
            background-color: #f1f5f9;
        }

        .flashcard.flipped-vertical .card-back {
            transform: rotateX(180deg);
        }

        .flashcard .card-front { pointer-events: auto; }
        .flashcard .card-back { pointer-events: none; }
        .flashcard.flipped .card-front, .flashcard.flipped-vertical .card-front { pointer-events: none; }
        .flashcard.flipped .card-back, .flashcard.flipped-vertical .card-back { pointer-events: auto; }

        .page-flip-next-out { animation: flipNextOut 0.3s forwards cubic-bezier(0.4, 0, 0.2, 1); transition: none !important; }
        .page-flip-next-in { animation: flipNextIn 0.3s forwards cubic-bezier(0.4, 0, 0.2, 1); transition: none !important; }
        .page-flip-prev-out { animation: flipPrevOut 0.3s forwards cubic-bezier(0.4, 0, 0.2, 1); transition: none !important; }
        .page-flip-prev-in { animation: flipPrevIn 0.3s forwards cubic-bezier(0.4, 0, 0.2, 1); transition: none !important; }

        @keyframes flipNextOut {
            0% { transform: rotateY(0deg); opacity: 1; }
            100% { transform: rotateY(-90deg); opacity: 0; }
        }
        @keyframes flipNextIn {
            0% { transform: rotateY(90deg); opacity: 0; }
            100% { transform: rotateY(0deg); opacity: 1; }
        }
        @keyframes flipPrevOut {
            0% { transform: rotateY(0deg); opacity: 1; }
            100% { transform: rotateY(90deg); opacity: 0; }
        }
        @keyframes flipPrevIn {
            0% { transform: rotateY(-90deg); opacity: 0; }
            100% { transform: rotateY(0deg); opacity: 1; }
        }

        .card-action-corner {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 10;
            display: flex;
            gap: 10px;
        }

        .card-action-corner-bottom-left {
            position: absolute;
            bottom: 15px;
            left: 15px;
            z-index: 10;
            display: flex;
            gap: 10px;
        }

        .action-icon-btn {
            background: #f1f5f9;
            border: 1px solid #cbd5e1;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .action-icon-btn:hover {
            transform: scale(1.05);
            background: #e2e8f0;
        }

        .action-icon-btn.status-mastered {
            background: #dcfce7;
            border-color: #86efac;
            color: #15803d;
        }

        .word {
            font-size: 6rem;
            font-weight: bold;
            color: var(--accent);
            margin-bottom: 10px;
        }

        .pinyin {
            font-size: 1.3rem;
            color: var(--primary);
            font-weight: 600;
            margin-bottom: 10px;
        }

        .meaning {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--text-main);
            margin-bottom: 25px;
            text-align: center;
        }

        .example-box {
            width: 100%;
            border-top: 1px solid #cbd5e1;
            padding-top: 15px;
            text-align: center;
        }

        .example-cn {
            font-size: 2.8rem;
            color: var(--accent);
            margin-bottom: 4px;
        }

        .example-py {
            font-size: 1.3rem;
            color: var(--text-muted);
            font-style: italic;
            margin-bottom: 4px;
        }

        .example-vn {
            font-size: 1.3rem;
            color: #475569;
            font-weight: 500;
        }

        .controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            width: 100%;
            margin-top: 10px;
        }

        .btn-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            font-weight: bold;
            border: 1px solid #cbd5e1;
            background-color: white;
            color: #334155;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
            outline: none;
        }

        .btn-icon:hover {
            transform: translateY(-2px);
            background-color: #f1f5f9;
            border-color: #94a3b8;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        .btn-icon:active {
            transform: translateY(1px);
        }

        .btn-icon.active {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }

        @media (max-width: 480px) {
            .btn-icon {
                width: 48px;
                height: 48px;
                font-size: 1.3rem;
            }
            .controls {
                gap: 8px;
            }
        }

        .loading, .error {
            font-size: 1.2rem;
            color: var(--text-muted);
            margin-top: 100px;
            font-weight: 500;
            text-align: center;
        }

        .error { color: var(--accent); }

        .word-list-modal, .pinyin-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .word-list-modal.open, .pinyin-modal.open {
            opacity: 1;
            pointer-events: auto;
        }

        .word-list-content, .pinyin-content {
            background-color: #ffffff;
            width: 100%;
            height: 100vh;
            height: 100dvh;
            border-radius: 0;
            display: flex;
            flex-direction: column;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }

        .word-list-modal.open .word-list-content,
        .pinyin-modal.open .pinyin-content {
            transform: translateY(0);
        }

        .word-list-header, .pinyin-header {
            padding: 16px 20px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .word-list-header h2, .pinyin-header h2 {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--primary);
            margin: 0;
        }

        .word-list-close {
            background: #f1f5f9;
            border: none;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            cursor: pointer;
            color: #475569;
            transition: all 0.2s ease;
        }

        .word-list-search-box {
            padding: 12px 20px;
            border-bottom: 1px solid #f1f5f9;
            background-color: #f8fafc;
        }

        .search-input {
            width: 100%;
            padding: 10px 40px 10px 16px;
            border-radius: 12px;
            border: 1px solid #cbd5e1;
            font-size: 16px;
            font-weight: 500;
            outline: none;
            transition: all 0.2s;
        }

        .search-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
            background-color: #ffffff;
        }

        .word-list-body {
            flex: 1;
            overflow-y: auto;
            padding: 12px 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            -webkit-overflow-scrolling: touch;
        }

        .word-list-table-container {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            background: #ffffff;
            margin-bottom: 8px;
        }

        .word-list-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            text-align: left;
            table-layout: fixed;
        }

        .grid-cell {
            cursor: pointer;
            transition: all 0.2s ease;
            background-color: #ffffff;
            color: var(--text-main);
            border: 1px solid #e2e8f0;
            height: 60px;
            text-align: center;
            vertical-align: middle;
            position: relative;
            padding: 12px 4px 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-weight: 600;
        }

        .grid-cell.item-mastered {
            background-color: #dcfce7 !important;
            color: #15803d !important;
        }

        .grid-cell.active-word {
            background-color: #ffedd5 !important;
            color: #ea580c !important;
        }

        .list-filter-tabs {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }

        .list-filter-btn {
            flex: 1;
            background-color: white;
            color: #64748b;
            border: 1px solid #cbd5e1;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 32px;
        }

        .list-filter-btn.active {
            background-color: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background-color: rgba(15, 23, 42, 0.9);
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: 600;
            z-index: 9999;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.35s cubic-bezier(0.4, 0, 0.2, 1), transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .toast-container.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .pinyin-iframe-container {
            flex: 1;
            width: 100%;
            height: 100%;
            border: none;
            overflow: hidden;
        }

        .pinyin-iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div id="loading" class="loading">Đang tải dữ liệu từ Google Sheet...</div>
    <div id="error" class="error" style="display: none;">Không thể tải dữ liệu. Vui lòng kiểm tra lại kết nối hoặc API.</div>

    <div class="container" id="main-content" style="display: none;">
        <div class="header">
            <div class="top-row">
                <h1 id="sheet-title">HSK</h1>
                <div class="top-actions">
                    <select id="hsk-level-select" class="select-box" onchange="changeHskLevel(event)">
                        <option value="HSK10">⭐HSK10(2)</option>
                        <option value="HSK21">⭐HSK21(3)</option>
						<option value="HSK22">☆ HSK22(4)</option>
                        <option value="HSK31">⭐HSK31(5)</option>
						<option value="HSK32">☆ HSK32(6)</option>
						<option value="HSK33">☆ HSK33(7)</option>
                        <option value="HSK41">⭐HSK41(CN)</option>
						<option value="HSK42">☆ HSK42(2)</option>
						<option value="HSK43">☆ HSK43(3)</option>
						<option value="HSK44">☆ HSK44(4)</option>
						<option value="HSK45">☆ HSK45(5)</option>
						<option value="HSK46">☆ HSK46(6)</option>
                        <option value="HSK5"> ⭐HSK5</option>
                        <option value="HSK6"> ⭐HSK6</option>
                    </select>
                    <select id="tts-rate-select" class="select-box" onchange="changeTtsRate(event)" title="Tốc độ đọc">
                        <option value="0.6">0.6x</option>
                        <option value="0.7">0.7x</option>
                        <option value="0.8">0.8x</option>
                        <option value="0.9">0.9x</option>
                        <option value="1.0" selected>1.0x</option>
                        <option value="1.1">1.1x</option>
                        <option value="1.2">1.2x</option>
                    </select>
                    <button id="tts-toggle" class="toggle-btn-icon active" onclick="toggleTts(event)" title="Âm thanh (TTS): BẬT">🔊</button>
                </div>
            </div>
            <div class="pagination-bar">
                <div class="pagination-item">
                    <label style="font-size: 0.75rem; font-weight: 600; color: #64748b;">Số dòng:</label>
                    <select id="records-per-page-select" class="select-box" onchange="changeRecordsPerPage(event)">
                        <option value="10">10</option>
                        <option value="20">20</option>
                        <option value="30">30</option>
                        <option value="40">40</option>
                        <option value="50">50</option>
                        <option value="all" selected>Tất cả</option>
                    </select>
                </div>
                <div class="pagination-item">
                    <label id="page-select-label" style="font-size: 0.75rem; font-weight: 600; color: #64748b;">Trang:</label>
                    <select id="page-select" class="select-box" onchange="changePage(event)">
                    </select>
                </div>
            </div>
            <div class="progress-box">
                <div class="progress" id="progress-text">0 / 0</div>
                <div id="cycles-badge" style="background-color: #fee2e2; color: #ef4444; font-size: 0.75rem; font-weight: 700; padding: 2px 8px; border-radius: 9999px; border: 1px solid #fca5a5;">Đã đọc: 0/10 lần</div>
                <div class="stats" id="stats-text">Thuộc: 0 | Chưa thuộc: 0</div>
            </div>
        </div>

        <div class="flashcard-wrapper" onclick="flipCard()">
            <div class="flashcard" id="card">
                <div class="card-face card-front">
                    <div class="card-action-corner">
                        <button id="mark-btn-front" class="action-icon-btn" onclick="toggleMastered(event)" title="Đánh dấu thuộc">✓</button>
                    </div>
                    <div class="card-action-corner-bottom-left">
                        <button class="action-icon-btn speak-card-btn" onclick="speakCurrentCardManual(event)" title="Phát âm thẻ">🔊</button>
                    </div>
                    <div class="word" id="front-word">...</div>
                    <div id="front-hanviet" style="font-size: 1.4rem; font-weight: bold; color: #475569; margin-top: -5px; margin-bottom: 10px; text-transform: uppercase; display: none;"></div>
                    <div class="pinyin" id="front-pinyin" style="margin-top: 15px;color:#ccc">...</div>
                </div>
                <div class="card-face card-back" style="padding: 20px; display: flex; flex-direction: column; justify-content: center; align-items: center;">
                    <div class="card-action-corner">
                        <button id="mark-btn-back" class="action-icon-btn" onclick="toggleMastered(event)" title="Đánh dấu thuộc">✓</button>
                    </div>
                    <div class="card-action-corner-bottom-left">
                        <button class="action-icon-btn speak-card-btn" onclick="speakCurrentCardManual(event)" title="Phát âm thẻ">🔊</button>
                    </div>
                    
                    <div class="back-word-header" style="position: absolute; top: 15px; left: 20px; right: 20px; border-bottom: 1px dashed #cbd5e1; padding-bottom: 8px; text-align: center; display: flex; flex-direction: column; gap: 4px; align-items: center; flex-shrink: 0; z-index: 10;">
                        <div style="font-size: 0.95rem; color: #64748b; font-weight: bold; display: flex; align-items: baseline; gap: 6px; justify-content: center;">
                            <b id="back-word-text" style="font-size: 1.4rem; color: var(--accent);"></b> <span id="back-hanviet" style="color: #475569; font-size: 1.15rem; text-transform: uppercase; font-weight: bold; display: none;"></span>
                        </div>
                        <div style="font-size: 0.95rem; font-weight: 500; display: flex; align-items: baseline; gap: 6px; justify-content: center; flex-wrap: wrap;">
                            <span class="pinyin" id="back-pinyin" style="color: var(--primary); font-weight: 600; font-size: 1.05rem; margin-bottom: 0;"></span> - <span class="meaning" id="back-meaning" style="color: var(--text-main); font-weight: 500; font-size: 1.05rem; margin-bottom: 0;"></span>
                        </div>
                    </div>

                    <div class="example-box" id="example-box" style="width: 100%; height: 245px; min-height: 245px; max-height: 245px; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #fffdfa; border: 1.5px solid #fed7aa; border-radius: 16px; padding: 25px 20px; box-shadow: 0 4px 12px rgba(249, 115, 22, 0.08); text-align: center; gap: 12px; box-sizing: border-box; overflow: hidden;">
                        <div class="example-cn" id="ex-cn" style="font-size: 2.3rem; font-weight: bold; color: #1e293b; line-height: 1.35; word-break: normal; overflow-wrap: break-word; white-space: normal;">...</div>
                        <div class="example-py" id="ex-py" style="font-size: 1.2rem; color: var(--primary); font-weight: 600; font-style: italic; line-height: 1.3; word-break: normal; overflow-wrap: break-word; white-space: normal;">...</div>
                        <div class="example-vn" id="ex-vn" style="font-size: 1.2rem; color: #475569; font-weight: 500; line-height: 1.3; word-break: normal; overflow-wrap: break-word; white-space: normal;">...</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="controls">
            <button id="filter-toggle" class="btn-icon" onclick="toggleFilter(event)" title="Xem: Tất cả">🗂️</button>
            <button id="display-mode-toggle" class="btn-icon" onclick="toggleDisplayMode(event)" title="Chế độ: Tuần tự">🔁</button>
            <button id="word-list-toggle" class="btn-icon" onclick="toggleWordList(event)" title="Xem danh sách từ">📋</button>
            <button id="typing-toggle" class="btn-icon" onclick="toggleTypingMode(event)" title="Chế độ gõ chữ (Typing): TẮT">⌨️</button>
            <button id="auto-play-btn" class="btn-icon" onclick="toggleAutoPlay()" title="Tự động lật & đọc: TẮT">▶</button>
            <button id="pinyin-modal-toggle" class="btn-icon" onclick="togglePinyinModal(event)" title="Học Pinyin">🔤</button>
        </div>
    </div>

    <script>
        let rawFlashcards = [];
        let filteredFlashcards = [];
        let paginatedFlashcards = [];
        let currentIndex = 0;
        let pageManualReadCount = 0;
        
        let isTtsEnabled = true;
        let ttsRate = '1.0';
        let currentFilter = 'all';
        let masteredIds = [];
        let displayMode = 'sequential';
        let isAutoPlaying = false;
        let autoPlayMode = 1; // 1: Chỉ mặt trước, 2: 2 mặt phát âm Trung, 3: 2 mặt phát âm Trung + Việt
        let autoPlayTimeout = null;
        let silentAudioHelper = null;
        let autoPlayState = 0;
        let autoPlayStateTimeLimit = 3000;
        let autoPlayElapsedTime = 0;
        let lastTickTime = Date.now();
        let currentHskLevel = 'HSK10';
        let recordsPerPage = 'all';
        let currentPage = 1;
        let listFilterMode = 'all';
        let showListPinyin = true;
        let showListMeaning = true;
        let showListHanViet = true;
        let listContentMode = 'word';

        // Đánh dấu URL auto-play đã được kiểm tra và kích hoạt hay chưa
        let urlAutoPlayChecked = false;

        let touchStartX = 0;
        let touchEndX = 0;
        let touchStartY = 0;
        let touchEndY = 0;

        const dbName = "HskFlashcardsDB";
        const dbVersion = 1;
        let db = null;

        function initDatabase() {
            return new Promise((resolve) => {
                const request = indexedDB.open(dbName, dbVersion);
                request.onerror = (event) => {
                    console.error("IndexedDB error:", event.target.error);
                    resolve(null);
                };
                request.onsuccess = (event) => {
                    db = event.target.result;
                    resolve(db);
                };
                request.onupgradeneeded = (event) => {
                    const database = event.target.result;
                    if (!database.objectStoreNames.contains("settings")) {
                        database.createObjectStore("settings", { keyPath: "key" });
                    }
                };
            });
        }

        function saveSetting(key, value) {
            if (!db) return;
            const transaction = db.transaction(["settings"], "readwrite");
            const store = transaction.objectStore("settings");
            store.put({ key: key, value: value });
        }

        function loadSetting(key, defaultValue) {
            return new Promise((resolve) => {
                if (!db) {
                    resolve(defaultValue);
                    return;
                }
                const transaction = db.transaction(["settings"], "readonly");
                const store = transaction.objectStore("settings");
                const request = store.get(key);
                request.onsuccess = (event) => {
                    if (event.target.result) {
                        resolve(event.target.result.value);
                    } else {
                        resolve(defaultValue);
                    }
                };
                request.onerror = () => {
                    resolve(defaultValue);
                };
            });
        }

        function shuffleList(array) {
            let cur = array.length, randomIndex;
            while (cur !== 0) {
                randomIndex = Math.floor(Math.random() * cur);
                cur--;
                [array[cur], array[randomIndex]] = [array[randomIndex], array[cur]];
            }
            return array;
        }

        async function fetchData(preservePosition = false) {
            let hasCache = false;

            const localMastered = JSON.parse(localStorage.getItem('hsk_mastered_ids') || '[]');
            masteredIds = await loadSetting('masteredIds', localMastered) || localMastered;

            const cachedList = await loadSetting('rawFlashcards_' + currentHskLevel, null);
            if (cachedList && cachedList.length > 0) {
                rawFlashcards = cachedList;
                hasCache = true;
                
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').style.display = 'none';
                document.getElementById('main-content').style.display = 'flex';
                
                await applyFilterAndRender(preservePosition);
            } else {
                document.getElementById('main-content').style.display = 'none';
                document.getElementById('loading').style.display = 'block';
                document.getElementById('error').style.display = 'none';
            }

            const API_GSHEET_URL = 'https://hsk-gilt.vercel.app/api/gSheet';
            const spreadId = '105i_4pdAfadq4G-ELDmrnopWW7H4pv0EZUg87xsPxtc';
            const apiUrl = `${API_GSHEET_URL}?sheet=${currentHskLevel}&act=read&spread=${spreadId}`;

            try {
                const response = await fetch(apiUrl, {
				  method: 'GET',
				  headers: {
					'Content-Type': 'application/json'
				  }
				});

                if (!response.ok) throw new Error('Network response error');
                
                const data = await response.json();
                
                if (data && data.values && data.values.length > 1) {
                    const rows = data.values.slice(1);
                    
                    const remoteFlashcards = rows.map(row => {
                        const item = {
                            stt: row[0] || '',
                            word: row[1] || '',
                            pinyin: row[2] || '',
                            meaning: row[3] || '',
                            exCn: row[4] || '',
                            exPy: row[5] || '',
                            exVn: row[6] || ''
                        };
                        const sheetStatus = row[7];
                        const mKey = currentHskLevel + '_' + item.stt;

                        if (sheetStatus === '1') {
                            if (!masteredIds.includes(mKey)) {
                                masteredIds.push(mKey);
                            }
                        } else if (sheetStatus === '0') {
                            const idx = masteredIds.indexOf(mKey);
                            if (idx > -1) {
                                masteredIds.splice(idx, 1);
                            }
                        }
                        return item;
                    }).filter(item => item.word);

                    localStorage.setItem('hsk_mastered_ids', JSON.stringify(masteredIds));
                    saveSetting('masteredIds', masteredIds);

                    if (remoteFlashcards.length > 0) {
                        rawFlashcards = remoteFlashcards;
                        saveSetting('rawFlashcards_' + currentHskLevel, remoteFlashcards);

                        document.getElementById('loading').style.display = 'none';
                        document.getElementById('error').style.display = 'none';
                        document.getElementById('main-content').style.display = 'flex';
                        
                        await applyFilterAndRender(preservePosition);
                    } else if (!hasCache) {
                        showError();
                    }
                } else if (!hasCache) {
                    showError();
                }
            } catch (error) {
                console.error('Error fetching data from server:', error);
                if (!hasCache) {
                    showError();
                }
            }
        }

        function showError() {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error').style.display = 'block';
        }

        async function applyFilterAndRender(preservePosition = false) {
            let baseList = [];
            if (currentFilter === 'all') {
                baseList = [...rawFlashcards];
            } else if (currentFilter === 'mastered') {
                baseList = rawFlashcards.filter(item => masteredIds.includes(currentHskLevel + '_' + item.stt));
            } else if (currentFilter === 'unmastered') {
                baseList = rawFlashcards.filter(item => !masteredIds.includes(currentHskLevel + '_' + item.stt));
            }

            filteredFlashcards = baseList;

            const masteredCount = rawFlashcards.filter(item => masteredIds.includes(currentHskLevel + '_' + item.stt)).length;
            const unmasteredCount = rawFlashcards.length - masteredCount;
            document.getElementById('stats-text').innerText = `Thuộc: ${masteredCount} | Chưa thuộc: ${unmasteredCount}`;

            if (preservePosition) {
                const savedPage = await loadSetting('currentPage_' + currentHskLevel, 1);
                currentPage = parseInt(savedPage) || 1;
            } else {
                currentPage = 1;
                saveSetting('currentPage_' + currentHskLevel, currentPage);
            }
            await updatePagination(preservePosition);

            if (document.getElementById('word-list-modal').classList.contains('open')) {
                renderWordListItems(document.getElementById('word-search').value);
            }

            // Kiểm tra tham số URL ?play=1,2,3 để tự động phát ngay khi dữ liệu được nạp lần đầu
            checkUrlAutoPlay();
        }

        function getPageSequentialItems() {
            if (recordsPerPage === 'all' || filteredFlashcards.length === 0) {
                return [...filteredFlashcards];
            } else {
                const size = parseInt(recordsPerPage);
                const totalPages = Math.ceil(filteredFlashcards.length / size);
                if (currentPage > totalPages) currentPage = 1;
                const start = (currentPage - 1) * size;
                const end = start + size;
                return filteredFlashcards.slice(start, end);
            }
        }

        async function updatePagination(preservePosition = false) {
            pageManualReadCount = 0;
            updateCyclesBadge();
            const pageSelect = document.getElementById('page-select');
            const pageSelectLabel = document.getElementById('page-select-label');
            pageSelect.innerHTML = '';

            const pageItems = getPageSequentialItems();
            if (displayMode === 'random') {
                paginatedFlashcards = shuffleList([...pageItems]);
            } else {
                paginatedFlashcards = pageItems;
            }

            if (recordsPerPage === 'all' || filteredFlashcards.length === 0) {
                pageSelect.style.display = 'none';
                pageSelectLabel.style.display = 'none';
            } else {
                const size = parseInt(recordsPerPage);
                const totalPages = Math.ceil(filteredFlashcards.length / size);

                pageSelect.style.display = 'inline-block';
                pageSelectLabel.style.display = 'inline-block';

                for (let i = 1; i <= totalPages; i++) {
                    const option = document.createElement('option');
                    option.value = i;
                    option.innerText = `Trang ${i}`;
                    if (i === currentPage) {
                        option.selected = true;
                    }
                    pageSelect.appendChild(option);
                }
            }

            if (preservePosition) {
                const savedIndex = await loadSetting('currentIndex_' + currentHskLevel, 0);
                currentIndex = parseInt(savedIndex) || 0;
                if (currentIndex >= paginatedFlashcards.length) {
                    currentIndex = 0;
                }
            } else {
                currentIndex = 0;
                saveSetting('currentIndex_' + currentHskLevel, currentIndex);
            }
            renderCard();
        }

        function changeRecordsPerPage(event) {
            recordsPerPage = event.target.value;
            saveSetting('recordsPerPage', recordsPerPage);
            currentPage = 1;
            saveSetting('currentPage_' + currentHskLevel, currentPage);
            updatePagination(false);
        }

        function changePage(event) {
            currentPage = parseInt(event.target.value);
            saveSetting('currentPage_' + currentHskLevel, currentPage);
            const cardElement = document.getElementById('card');
            if (cardElement && !isTransitioning) {
                isTransitioning = true;
                cardElement.classList.remove('flipped');
                cardElement.classList.remove('flipped-vertical');
                
                cardElement.classList.add('page-flip-next-out');
                setTimeout(() => {
                    updatePagination(false);
                    cardElement.classList.remove('page-flip-next-out');
                    cardElement.classList.add('page-flip-next-in');
                    setTimeout(() => {
                        cardElement.classList.remove('page-flip-next-in');
                        isTransitioning = false;
                    }, 300);
                }, 300);
            } else {
                updatePagination(false);
            }
        }

        function renderCard(preventSpeak = false) {
            const cardElement = document.getElementById('card');
            cardElement.classList.remove('flipped');
            cardElement.classList.remove('flipped-vertical');

            if (paginatedFlashcards.length === 0) {
                document.getElementById('front-word').innerText = "Trống";
                document.getElementById('front-pinyin').innerText = "";
                document.getElementById('back-pinyin').innerText = "";
                document.getElementById('back-meaning').innerText = "Không có thẻ nào trong danh mục này";
                document.getElementById('example-box').style.display = 'none';
                document.getElementById('progress-text').innerText = "0 / 0";
                const backWordTextEl = document.getElementById('back-word-text');
                if (backWordTextEl) backWordTextEl.innerText = "";
                return;
            }

            const current = paginatedFlashcards[currentIndex];
            window.currentWordInfo = {
                ...current,
                isFlipped: false
            };

            const listContainer = document.getElementById('word-list-items-container');
            if (listContainer && current) {
                listContainer.querySelectorAll('.grid-cell:not(.empty-cell)').forEach(el => {
                    if (el.getAttribute('data-stt') === String(current.stt)) {
                        el.classList.add('active-word');
                        el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    } else {
                        el.classList.remove('active-word');
                    }
                });
                
                const detailDisplay = document.getElementById('example-detail-display');
                if (detailDisplay) {
                    showExampleDetail(current.stt);
                }
            }
            
            document.getElementById('progress-text').innerText = `${currentIndex + 1} / ${paginatedFlashcards.length}`;
            document.getElementById('front-word').innerText = current.word;
            document.getElementById('front-pinyin').innerText = current.pinyin;

            const backWordTextEl = document.getElementById('back-word-text');
            if (backWordTextEl) backWordTextEl.innerText = current.word;

            document.getElementById('back-pinyin').innerText = current.pinyin;
            document.getElementById('back-meaning').innerText = current.meaning;

            const hanViet = (window.getHanVietForWord && typeof window.getHanVietForWord === 'function') ? window.getHanVietForWord(current.word) : '';
            const backHvEl = document.getElementById('back-hanviet');
            if (hanViet && hanViet !== ' ') {
                backHvEl.innerText = `[${hanViet}]`;
                backHvEl.style.display = 'inline-block';
            } else {
                backHvEl.style.display = 'none';
            }
            
            if(current.exCn) {
                document.getElementById('example-box').style.display = 'block';
                if (current.word && current.exCn.includes(current.word)) {
                    const regex = new RegExp(current.word, 'g');
                    document.getElementById('ex-cn').innerHTML = current.exCn.replace(regex, `<span style="color: red;background: powderblue;">${current.word}</span>`);
                } else {
                    document.getElementById('ex-cn').innerText = current.exCn;
                }
                document.getElementById('ex-py').innerText = current.exPy;
                document.getElementById('ex-vn').innerText = current.exVn;
            } else {
                document.getElementById('example-box').style.display = 'none';
            }

            const isMastered = masteredIds.includes(currentHskLevel + '_' + current.stt);
            const frontMarkBtn = document.getElementById('mark-btn-front');
            const backMarkBtn = document.getElementById('mark-btn-back');
            if (isMastered) {
                frontMarkBtn.classList.add('status-mastered');
                backMarkBtn.classList.add('status-mastered');
            } else {
                frontMarkBtn.classList.remove('status-mastered');
                backMarkBtn.classList.remove('status-mastered');
            }

            if (!isAutoPlaying) {
                if (isTtsEnabled && !preventSpeak) {
                    speakUniversalText(current.word, false);
                }
            }

            if (typeof window.onCardRendered === 'function') {
                window.onCardRendered();
            }
        }

        function flipCard() {
            if (paginatedFlashcards.length === 0 || isTransitioning) return;
            const cardElement = document.getElementById('card');
            
            cardElement.classList.toggle('flipped-vertical');
            cardElement.classList.remove('flipped');
            currentFlipDirection = 'normal';
            
            const current = paginatedFlashcards[currentIndex];

            if (!isAutoPlaying) {
                if (isTtsEnabled) {
                    const isFlippedNow = cardElement.classList.contains('flipped-vertical');
                    const textToSpeak = isFlippedNow ? (current.exCn || current.word) : current.word;
                    speakUniversalText(textToSpeak, false);
                }
            }
        }

        let currentFlipDirection = 'normal';
        let isTransitioning = false;

        function nextCard() {
            if (paginatedFlashcards.length === 0 || isTransitioning) return;
            if (isAutoPlaying) {
                toggleAutoPlay(true);
            }
            
            isTransitioning = true;
            const cardElement = document.getElementById('card');
            cardElement.classList.remove('flipped');
            cardElement.classList.remove('flipped-vertical');
            cardElement.classList.add('page-flip-next-out');
            
            setTimeout(() => {
                let nextIdx = (currentIndex + 1) % paginatedFlashcards.length;
                let cycleCompleted = false;

                if (nextIdx === 0 && paginatedFlashcards.length > 0) {
                    pageManualReadCount++;
                    cycleCompleted = true;
                }

                if (nextIdx === 0 && displayMode === 'random' && paginatedFlashcards.length > 1) {
                    paginatedFlashcards = shuffleList([...getPageSequentialItems()]);
                }

                if (cycleCompleted) {
                    if (pageManualReadCount >= 10) {
                        showToast("Đã đọc đủ 10 lần! Chuyển sang trang tiếp theo.");
                        pageManualReadCount = 0;
                        updateCyclesBadge();
                        cardElement.classList.remove('page-flip-next-out');
                        isTransitioning = false;
                        
                        if (recordsPerPage !== 'all') {
                            nextPage();
                        } else {
                            currentIndex = 0;
                            saveSetting('currentIndex_' + currentHskLevel, currentIndex);
                            renderCard();
                        }
                        return;
                    } else {
                        showToast(`Đã đọc ${pageManualReadCount}/10 lần`);
                        updateCyclesBadge();
                    }
                }

                currentIndex = nextIdx;
                saveSetting('currentIndex_' + currentHskLevel, currentIndex);
                renderCard();
                cardElement.classList.remove('page-flip-next-out');
                cardElement.classList.add('page-flip-next-in');
                
                setTimeout(() => {
                    cardElement.classList.remove('page-flip-next-in');
                    isTransitioning = false;
                }, 300);
            }, 300);
        }

        function prevCard() {
            if (paginatedFlashcards.length === 0 || isTransitioning) return;
            if (isAutoPlaying) {
                toggleAutoPlay(true);
            }
            isTransitioning = true;
            
            const cardElement = document.getElementById('card');
            cardElement.classList.remove('flipped');
            cardElement.classList.remove('flipped-vertical');
            cardElement.classList.add('page-flip-prev-out');
            
            setTimeout(() => {
                let prevIdx = (currentIndex - 1 + paginatedFlashcards.length) % paginatedFlashcards.length;
                if (currentIndex === 0 && displayMode === 'random' && paginatedFlashcards.length > 1) {
                    paginatedFlashcards = shuffleList([...getPageSequentialItems()]);
                }
                currentIndex = prevIdx;
                saveSetting('currentIndex_' + currentHskLevel, currentIndex);
                renderCard();
                cardElement.classList.remove('page-flip-prev-out');
                cardElement.classList.add('page-flip-prev-in');
                
                setTimeout(() => {
                    cardElement.classList.remove('page-flip-prev-in');
                    isTransitioning = false;
                }, 300);
            }, 300);
        }

        function prevPage() {
            if (recordsPerPage === 'all' || isTransitioning) return;
            const size = parseInt(recordsPerPage);
            const totalPages = Math.ceil(filteredFlashcards.length / size);

            if (isAutoPlaying) {
                toggleAutoPlay(true);
            }

            if (currentPage <= 1) {
                currentPage = totalPages;
            } else {
                currentPage--;
            }
            saveSetting('currentPage_' + currentHskLevel, currentPage);

            const pageSelect = document.getElementById('page-select');
            if (pageSelect) {
                pageSelect.value = currentPage;
            }

            isTransitioning = true;
            const cardElement = document.getElementById('card');
            if (cardElement) {
                cardElement.classList.remove('flipped');
                cardElement.classList.remove('flipped-vertical');
                cardElement.classList.add('page-flip-prev-out');

                setTimeout(() => {
                    updatePagination(false);
                    cardElement.classList.remove('page-flip-prev-out');
                    cardElement.classList.add('page-flip-prev-in');
                    setTimeout(() => {
                        cardElement.classList.remove('page-flip-prev-in');
                        isTransitioning = false;
                    }, 300);
                }, 300);
            } else {
                updatePagination(false);
                isTransitioning = false;
            }
        }

        function nextPage(preserveAutoPlay = false) {
            if (recordsPerPage === 'all' || isTransitioning) return;
            const size = parseInt(recordsPerPage);
            const totalPages = Math.ceil(filteredFlashcards.length / size);

            if (isAutoPlaying && !preserveAutoPlay) {
                toggleAutoPlay(true);
            }

            if (currentPage >= totalPages) {
                currentPage = 1;
            } else {
                currentPage++;
            }
            saveSetting('currentPage_' + currentHskLevel, currentPage);

            const pageSelect = document.getElementById('page-select');
            if (pageSelect) {
                pageSelect.value = currentPage;
            }

            const cardElement = document.getElementById('card');
            if (cardElement && !document.hidden) {
                isTransitioning = true;
                cardElement.classList.remove('flipped');
                cardElement.classList.remove('flipped-vertical');
                cardElement.classList.add('page-flip-next-out');

                setTimeout(() => {
                    updatePagination(false);
                    cardElement.classList.remove('page-flip-next-out');
                    cardElement.classList.add('page-flip-next-in');
                    setTimeout(() => {
                        cardElement.classList.remove('page-flip-next-in');
                        isTransitioning = false;
                    }, 300);
                }, 300);
            } else {
                updatePagination(false);
                isTransitioning = false;
            }
        }

        function toggleTts(event) {
            event.stopPropagation();
            isTtsEnabled = !isTtsEnabled;
            saveSetting('isTtsEnabled', isTtsEnabled);
            const ttsBtn = document.getElementById('tts-toggle');
            if (isTtsEnabled) {
                ttsBtn.innerHTML = "🔊";
                ttsBtn.title = "Âm thanh (TTS): BẬT";
                ttsBtn.classList.add('active');
                if (paginatedFlashcards.length > 0 && !isAutoPlaying) {
                    const current = paginatedFlashcards[currentIndex];
                    const cardElement = document.getElementById('card');
                    const isFlippedNow = cardElement.classList.contains('flipped-vertical');
                    const textToSpeak = isFlippedNow ? (current.exCn || current.word) : current.word;
                    speakUniversalText(textToSpeak, false);
                }
            } else {
                ttsBtn.innerHTML = "🔇";
                ttsBtn.title = "Âm thanh (TTS): TẮT";
                ttsBtn.classList.remove('active');
                if (isAutoPlaying) {
                    toggleAutoPlay(true);
                }
                if (typeof window.stopSpeak === 'function') {
                    window.stopSpeak();
                }
            }
        }

        async function toggleDisplayMode(event) {
            if (event && typeof event.stopPropagation === 'function') {
                event.stopPropagation();
            }
            
            let currentStt = null;
            if (paginatedFlashcards.length > 0 && paginatedFlashcards[currentIndex]) {
                currentStt = paginatedFlashcards[currentIndex].stt;
            }
            
            const modeBtn = document.getElementById('display-mode-toggle');
            if (displayMode === 'sequential') {
                displayMode = 'random';
                modeBtn.innerHTML = "🔀";
                modeBtn.title = "Chế độ: Ngẫu nhiên";
                modeBtn.classList.add('active');
            } else {
                displayMode = 'sequential';
                modeBtn.innerHTML = "🔁";
                modeBtn.title = "Chế độ: Tuần tự";
                modeBtn.classList.remove('active');
            }
            saveSetting('displayMode', displayMode);
            
            await applyFilterAndRender(true);
            
            if (currentStt && paginatedFlashcards.length > 0) {
                const foundIndex = paginatedFlashcards.findIndex(item => item.stt === currentStt);
                if (foundIndex !== -1) {
                    currentIndex = foundIndex;
                    saveSetting('currentIndex_' + currentHskLevel, currentIndex);
                }
            }
            renderCard();
        }

        function initSilentAudioHelper() {
            if (!silentAudioHelper) {
                silentAudioHelper = new Audio("data:audio/wav;base64,UklGRpwAAABXQVZFZm10IBAAAAABAAEAIlYAAESsAAACABAAZGF0YXBCAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA");
                silentAudioHelper.loop = true;
                silentAudioHelper.addEventListener('timeupdate', () => {
                    if (isAutoPlaying) {
                        runAutoPlayTimeUpdate();
                    }
                });
            }
        }

        function runAutoPlayTimeUpdate() {
            if (!isAutoPlaying || paginatedFlashcards.length === 0) return;
            
            const now = Date.now();
            const delta = now - lastTickTime;
            lastTickTime = now;
            
            if (delta <= 0 || delta > 2000) {
                autoPlayElapsedTime += 250;
            } else {
                autoPlayElapsedTime += delta;
            }
            
            if (autoPlayElapsedTime >= autoPlayStateTimeLimit) {
                autoPlayElapsedTime = 0;
                advanceAutoPlayState();
            }
        }

        function advanceAutoPlayState() {
            if (!isAutoPlaying || paginatedFlashcards.length === 0) return;
            
            const cardElement = document.getElementById('card');
            const current = paginatedFlashcards[currentIndex];
            if (!current) return;
            
            if (autoPlayState === 0) {
                if (autoPlayMode === 1) {
                    autoPlayState = 3;
                    autoPlayStateTimeLimit = document.hidden ? 50 : 600;
                    transitionToNextCardAutoPlay();
                } else {
                    autoPlayState = 1;
                    autoPlayStateTimeLimit = (autoPlayMode === 3) ? 4000 : 4500;
                    
                    if (cardElement) {
                        cardElement.classList.add('flipped-vertical');
                    }
                    const textToSpeak = current.exCn || current.word;
                    speakUniversalText(textToSpeak, false);
                }
            } else if (autoPlayState === 1) {
                if (autoPlayMode === 2) {
                    autoPlayState = 3;
                    autoPlayStateTimeLimit = document.hidden ? 50 : 600;
                    transitionToNextCardAutoPlay();
                } else if (autoPlayMode === 3) {
                    autoPlayState = 2;
                    autoPlayStateTimeLimit = 3500;
                    
                    const textToSpeakVn = current.exVn || current.meaning;
                    speakUniversalText(textToSpeakVn, true);
                }
            } else if (autoPlayState === 2) {
                autoPlayState = 3;
                autoPlayStateTimeLimit = document.hidden ? 50 : 600;
                transitionToNextCardAutoPlay();
            } else if (autoPlayState === 3) {
                autoPlayState = 0;
                autoPlayStateTimeLimit = 3000;
                autoPlayElapsedTime = 0;
                
                if (cardElement) {
                    cardElement.classList.remove('flipped');
                    cardElement.classList.remove('flipped-vertical');
                }
                speakUniversalText(current.word, false);
            }
        }

        // Khởi động trực tiếp chế độ tự động phát (Chế độ 1, 2, hoặc 3)
        function startAutoPlay(mode = 1) {
            if (paginatedFlashcards.length === 0) return;
            const autoPlayBtn = document.getElementById('auto-play-btn');
            
            initSilentAudioHelper();
            
            isAutoPlaying = true;
            autoPlayMode = [1, 2, 3].includes(Number(mode)) ? Number(mode) : 1;
            saveSetting('autoPlayMode', autoPlayMode);
            
            if (!isTtsEnabled) {
                isTtsEnabled = true;
                saveSetting('isTtsEnabled', isTtsEnabled);
                const ttsBtn = document.getElementById('tts-toggle');
                if (ttsBtn) {
                    ttsBtn.innerHTML = "🔊";
                    ttsBtn.title = "Âm thanh (TTS): BẬT";
                    ttsBtn.classList.add('active');
                }
            }
            
            if (autoPlayBtn) {
                if (autoPlayMode === 1) {
                    autoPlayBtn.innerHTML = "❶";
                    autoPlayBtn.title = "Tự động: 1 (Chỉ đọc mặt trước) - Bấm để đổi Chế độ 2";
                } else if (autoPlayMode === 2) {
                    autoPlayBtn.innerHTML = "❷";
                    autoPlayBtn.title = "Tự động: 2 (Đọc từ + Ví dụ Trung) - Bấm để đổi Chế độ 3";
                } else if (autoPlayMode === 3) {
                    autoPlayBtn.innerHTML = "❸";
                    autoPlayBtn.title = "Tự động: 3 (Đọc từ + Ví dụ Trung + Việt) - Bấm để TẮT";
                }
                autoPlayBtn.classList.add('active');
            }
            
            if (silentAudioHelper) {
                silentAudioHelper.play().catch(e => console.warn('Bỏ qua lỗi tự động phát Audio im lặng:', e));
            }
            
            autoPlayState = 0;
            autoPlayElapsedTime = 0;
            lastTickTime = Date.now();
            autoPlayStateTimeLimit = 3000;
            
            const cardElement = document.getElementById('card');
            if (cardElement) {
                cardElement.classList.remove('flipped');
                cardElement.classList.remove('flipped-vertical');
            }
            const current = paginatedFlashcards[currentIndex];
            if (current) {
                speakUniversalText(current.word, false);
            }
        }

        // Bật / Tắt chế độ tự động đọc chuyển từ tuần tự/ngẫu nhiên luân phiên 3 chế độ (1 -> 2 -> 3 -> TẮT)
        function toggleAutoPlay(forceOff = false) {
            if (paginatedFlashcards.length === 0) return;
            const autoPlayBtn = document.getElementById('auto-play-btn');
            
            initSilentAudioHelper();
            
            if (forceOff || (isAutoPlaying && autoPlayMode === 3)) {
                isAutoPlaying = false;
                autoPlayMode = 1;
                saveSetting('autoPlayMode', autoPlayMode);
                
                if (autoPlayBtn) {
                    autoPlayBtn.innerHTML = "▶";
                    autoPlayBtn.title = "Tự động lật & đọc: TẮT";
                    autoPlayBtn.classList.remove('active');
                }
                
                if (silentAudioHelper) {
                    silentAudioHelper.pause();
                }
                if (typeof window.stopSpeak === 'function') {
                    window.stopSpeak();
                }
                const cardElement = document.getElementById('card');
                if (cardElement) {
                    cardElement.classList.remove('flipped');
                    cardElement.classList.remove('flipped-vertical');
                }
                return;
            }

            if (!isAutoPlaying) {
                startAutoPlay(1);
            } else if (autoPlayMode === 1) {
                startAutoPlay(2);
            } else if (autoPlayMode === 2) {
                startAutoPlay(3);
            }
        }

        // Kiểm tra tham số ?play=1,2,3 trên URL khi tải trang
        function checkUrlAutoPlay() {
            if (urlAutoPlayChecked) return;
            
            const urlParams = new URLSearchParams(window.location.search);
            const playParam = urlParams.get('play');
            
            if (playParam !== null && playParam !== undefined) {
                const val = playParam.trim().toLowerCase();
                let modeToPlay = null;
                
                if (val === '1' || val === '2' || val === '3') {
                    modeToPlay = parseInt(val, 10);
                } else if (val === '' || val === 'true' || val === 'yes' || val === 'on' || val === 'auto') {
                    modeToPlay = 1;
                }
                
                if (modeToPlay && paginatedFlashcards.length > 0) {
                    urlAutoPlayChecked = true;
                    console.log(`[URL Param] Phát hiện ?play=${playParam} -> Khởi chạy tự động phát Chế độ ${modeToPlay}`);
                    
                    startAutoPlay(modeToPlay);
                    
                    const modeDesc = modeToPlay === 1 
                        ? 'Chế độ 1 (Chỉ đọc từ)' 
                        : (modeToPlay === 2 ? 'Chế độ 2 (Từ + Ví dụ Trung)' : 'Chế độ 3 (Từ + Ví dụ Trung + Việt)');
                    showToast(`Tự động phát: ${modeDesc}`);

                    // Đề phòng chính sách chặn âm thanh trình duyệt (Autoplay policy), kích hoạt ngay khi chạm màn hình
                    const resumeAudioOnInteraction = () => {
                        if (isAutoPlaying) {
                            initSilentAudioHelper();
                            if (silentAudioHelper && silentAudioHelper.paused) {
                                silentAudioHelper.play().catch(() => {});
                            }
                            const current = paginatedFlashcards[currentIndex];
                            if (current && autoPlayState === 0) {
                                speakUniversalText(current.word, false);
                            }
                        }
                    };
                    window.addEventListener('click', resumeAudioOnInteraction, { once: true });
                    window.addEventListener('touchstart', resumeAudioOnInteraction, { once: true });
                }
            }
        }

        function transitionToNextCardAutoPlay() {
            if (!isAutoPlaying) return;
            
            const cardElement = document.getElementById('card');
            
            let nextIdx = (currentIndex + 1) % paginatedFlashcards.length;
            let cycleCompleted = false;

            if (nextIdx === 0 && paginatedFlashcards.length > 0) {
                pageManualReadCount++;
                cycleCompleted = true;
            }

            if (nextIdx === 0 && displayMode === 'random' && paginatedFlashcards.length > 1) {
                paginatedFlashcards = shuffleList([...getPageSequentialItems()]);
            }

            if (cycleCompleted) {
                if (pageManualReadCount >= 10) {
                    showToast("Đã đọc đủ 10 lần! Chuyển sang trang tiếp theo.");
                    pageManualReadCount = 0;
                    updateCyclesBadge();
                    
                    if (recordsPerPage !== 'all') {
                        nextPage(true);
                    } else {
                        currentIndex = 0;
                        saveSetting('currentIndex_' + currentHskLevel, currentIndex);
                        renderCard();
                    }
                    
                    autoPlayState = 3;
                    autoPlayStateTimeLimit = document.hidden ? 50 : 600;
                    autoPlayElapsedTime = 0;
                    return;
                } else {
                    showToast(`Đã đọc ${pageManualReadCount}/10 lần`);
                    updateCyclesBadge();
                }
            }

            currentIndex = nextIdx;
            saveSetting('currentIndex_' + currentHskLevel, currentIndex);

            if (document.hidden) {
                renderCard();
                autoPlayState = 3;
                autoPlayStateTimeLimit = 50;
                autoPlayElapsedTime = 0;
            } else {
                isTransitioning = true;
                if (cardElement) {
                    cardElement.classList.remove('flipped');
                    cardElement.classList.remove('flipped-vertical');
                    cardElement.classList.add('page-flip-next-out');
                }
                
                setTimeout(() => {
                    renderCard();
                    if (cardElement) {
                        cardElement.classList.remove('page-flip-next-out');
                        cardElement.classList.add('page-flip-next-in');
                    }
                    
                    setTimeout(() => {
                        if (cardElement) {
                            cardElement.classList.remove('page-flip-next-in');
                        }
                        isTransitioning = false;
                    }, 300);
                }, 300);
            }
        }

        async function updateMasteredOnSheet(wordItem, isMastered, showSuccessToast = false) {
            const API_GSHEET_URL = 'https://hsk-gilt.vercel.app/api/gSheet';
            const spreadId = '105i_4pdAfadq4G-ELDmrnopWW7H4pv0EZUg87xsPxtc';

            const rowData = [
                String(wordItem.stt !== undefined && wordItem.stt !== null ? wordItem.stt : ''),
                String(wordItem.word !== undefined && wordItem.word !== null ? wordItem.word : ''),
                String(wordItem.pinyin !== undefined && wordItem.pinyin !== null ? wordItem.pinyin : ''),
                String(wordItem.meaning !== undefined && wordItem.meaning !== null ? wordItem.meaning : ''),
                String(wordItem.exCn !== undefined && wordItem.exCn !== null ? wordItem.exCn : ''),
                String(wordItem.exPy !== undefined && wordItem.exPy !== null ? wordItem.exPy : ''),
                String(wordItem.exVn !== undefined && wordItem.exVn !== null ? wordItem.exVn : ''),
                isMastered ? '1' : '0'
            ];

            try {
                const response = await fetch(API_GSHEET_URL, {
                    method: 'POST',
                    headers: {
                        'accept': 'application/json',
                        'content-type': 'application/json'
                    },
                    body: JSON.stringify({
                        act: 'updateByPosVal',
                        pos: 1,
                        val: wordItem.word,
                        sheet: currentHskLevel,
                        spread: spreadId,
                        data: JSON.stringify(rowData),
                    })
                });

                if (!response.ok) {
                    throw new Error(`HTTP status error: ${response.status}`);
                }

                const result = await response.json();
                console.log('Cập nhật trạng thái lên Google Sheet thành công:', result);
                if (showSuccessToast) {
                    showToast(`Đã lưu thay đổi cho từ "${wordItem.word}"`);
                }
            } catch (error) {
                console.error('Lỗi khi cập nhật trạng thái lên Google Sheet:', error);
                if (showSuccessToast) {
                    showToast(`Lỗi đồng bộ Google Sheets, nhưng đã lưu trên thiết bị.`);
                }
            }
        }

        function toggleMastered(event) {
            event.stopPropagation();

            const current = paginatedFlashcards[currentIndex];

            localStorage.setItem('hsk_mastered_ids', JSON.stringify(masteredIds));
            saveSetting('masteredIds', masteredIds);

            const masteredCount = rawFlashcards.filter(item => masteredIds.includes(currentHskLevel + '_' + item.stt)).length;
            const unmasteredCount = rawFlashcards.length - masteredCount;
            document.getElementById('stats-text').innerText = `Thuộc: ${masteredCount} | Chưa thuộc: ${unmasteredCount}`;

            updateMasteredOnSheet(current, isNowMastered);

            if (currentFilter !== 'all') {
                if (isAutoPlaying) toggleAutoPlay(true);

        function navigateWordList(direction) {
            const container = document.getElementById('word-list-items-container');
            if (!container) return;
            const items = Array.from(container.querySelectorAll('.grid-cell:not(.empty-cell)'));
            if (items.length === 0) return;

            let activeIdx = items.findIndex(el => el.classList.contains('active-word'));
            let targetIdx = 0;

            if (activeIdx === -1) {
                targetIdx = direction === 'next' ? 0 : items.length - 1;
            } else {
                if (direction === 'next') {
                    targetIdx = (activeIdx + 1) % items.length;
                } else {
                    targetIdx = (activeIdx - 1 + items.length) % items.length;
                }
            }

            const targetEl = items[targetIdx];
            if (targetEl) {
                targetEl.click();
                if (targetIdx === 0) {
                    container.scrollTop = 0;
                } else if (targetIdx === items.length - 1) {
                    container.scrollTop = container.scrollHeight;
                } else {
                    targetEl.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
            }
        }

        document.addEventListener('keydown', (event) => {
            const wordListModal = document.getElementById('word-list-modal');
            const isModalOpen = wordListModal && wordListModal.classList.contains('open');
            const pinyinModal = document.getElementById('pinyin-modal');
            const isPinyinModalOpen = pinyinModal && pinyinModal.classList.contains('open');

            if (event.target.tagName === 'INPUT' || event.target.tagName === 'TEXTAREA' || event.target.isContentEditable) {
                if (event.target.id === 'typing-input') {
                    if (event.key === 'ArrowLeft' || event.key === 'ArrowRight' || event.key === 'ArrowUp' || event.key === 'ArrowDown') {
                    } else {
                        return;
                    }
                } else {
                    if (isModalOpen) {
                        if (event.key === 'Escape') {
                            event.preventDefault();
                            closeWordList();
                            return;
                        }
                        if (event.key === 'ArrowDown') {
                            event.preventDefault();
                            navigateWordList('next');
                            return;
                        }
                        if (event.key === 'ArrowUp') {
                            event.preventDefault();
                            navigateWordList('prev');
                            return;
                        }
                    }
                    if (isPinyinModalOpen) {
                        if (event.key === 'Escape') {
                            event.preventDefault();
                            closePinyinModal();
                            return;
                        }
                    }
                    return;
                }
            }

            if (isPinyinModalOpen) {
                if (event.key === 'Escape') {
                    event.preventDefault();
                    closePinyinModal();
                    return;
                }
                return;
            }

            if (isModalOpen) {
                if (event.key === 'Escape') {
                    event.preventDefault();
                    closeWordList();
                    return;
                }
                if (event.key === 'ArrowRight' || event.key === 'ArrowDown') {
                    event.preventDefault();
                    navigateWordList('next');
                    return;
                }
                if (event.key === 'ArrowLeft' || event.key === 'ArrowUp') {
                    event.preventDefault();
                    navigateWordList('prev');
                    return;
                }
                return;
            }

            if (document.getElementById('main-content').style.display === 'none') return;

            if (event.key === 'ArrowRight' || event.key === ' ') {
                event.preventDefault();
                nextCard();
            } else if (event.key === 'ArrowLeft') {
                event.preventDefault();
                prevCard();
            } else if (event.key === 'ArrowUp') {
                event.preventDefault();
                currentFlipDirection = 'vertical';
                flipCard();
            } else if (event.key === 'ArrowDown') {
                event.preventDefault();
                speakCurrentCardManual(event);
            } else if (event.key.toLowerCase() === 'm' || event.key === 'Enter') {
                event.preventDefault();
                toggleMastered(event);
            } else if (event.key.toLowerCase() === 'p') {
                event.preventDefault();
                toggleAutoPlay();
            } else if (event.key === '7') {
                event.preventDefault();
                prevPage();
            } else if (event.key === '9') {
                event.preventDefault();
                nextPage();
            } else if (event.key === '0') {
                event.preventDefault();
                toggleDisplayMode(event);
            }
        });

        const cardWrapper = document.querySelector('.flashcard-wrapper');

        cardWrapper.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
        }, { passive: true });

        cardWrapper.addEventListener('touchmove', (e) => {
            e.preventDefault();
        }, { passive: false });

        cardWrapper.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            touchEndY = e.changedTouches[0].screenY;
            handleSwipeGesture();
        }, { passive: true });

        function handleSwipeGesture() {
            const diffX = touchEndX - touchStartX;
            const diffY = touchEndY - touchStartY;
            const threshold = 50;

            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (Math.abs(diffX) > threshold) {
                    if (diffX > 0) {
                        prevCard();
                    } else {
                        nextCard();
                    }
                }
            } else {
                if (Math.abs(diffY) > threshold) {
                    currentFlipDirection = 'vertical';
                    flipCard();
                }
            }
        }
