<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Báo Thức Thông Minh Pro</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="brand">
        <img src="icons/icon48.png" alt="Alarm Clock" class="brand-icon">
        <div>
          <h1 class="brand-title">Báo Thức Pro</h1>
          <p class="brand-sub">Trợ lý nhắc việc & báo thức</p>
        </div>
      </div>
      <button id="btnOpenOptionsTab" class="btn-icon" title="Mở trang quản lý trong tab riêng">
        ↗️
      </button>
    </header>

    <!-- Main Setting: Hiển thị Assistive trên màn hình hay không -->
    <main class="setting-box">
      <div class="setting-content">
        <div class="setting-text">
          <label for="toggleAssistive" class="setting-label">Hiển thị trên màn hình</label>
          <p class="setting-desc">Bật để hiển thị toàn bộ bảng quản lý báo thức (Assistive) trực tiếp trên trang web hiện tại.</p>
        </div>
        <label class="switch-lg">
          <input type="checkbox" id="toggleAssistive">
          <span class="slider-lg"></span>
        </label>
      </div>

      <!-- Real-time Status Badge -->
      <div id="assistiveStatusBanner" class="status-banner off">
        <span class="status-dot"></span>
        <span id="assistiveStatusText">Đang ẩn trên màn hình</span>
      </div>
    </main>

    <!-- Quick Info & Stats -->
    <footer class="popup-footer">
      <div class="stats-row">
        <div class="stat-item">
          <span class="stat-label">Thời gian:</span>
          <span id="popupClock" class="stat-value">00:00:00</span>
        </div>
        <div class="stat-item">
          <span class="stat-label">Đang bật:</span>
          <span id="activeAlarmsCount" class="stat-badge">0 mốc</span>
        </div>
      </div>

      <button id="btnOpenFullTab" class="btn-link-action">
        <span>Mở Bảng Quản Lý Toàn Màn Hình</span>
        <span class="arrow">↗</span>
      </button>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
